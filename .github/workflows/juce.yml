name: JUCE

# @soundor/juce-runtime on one version of JUCE, on every platform: the JUCE
# adapters and a real plugin, linked to the engine its caller selected. Verify
# and the release call it once for each version of JUCE it supports.
on:
  workflow_call:
    inputs:
      juce:
        description: The JUCE commit to build with
        type: string
        required: true
      msvc-toolset:
        description: The MSVC toolset to build with on Windows; empty for the runner's newest
        type: string
        required: false
        default: ''
      cache:
        description: Cache the pnpm store and downloaded engine archives (disabled by Release)
        type: boolean
        default: true
      build-engine:
        description: Use CI engine artifacts rather than the released engine
        type: boolean
        required: true
      engine-release:
        description: Use this published prebuilt release of the checkout's engine (Release, when it reuses one)
        type: string
        default: ''
      engine-run-id:
        description: Successful main run to reuse (empty for this run)
        type: string
        default: ''
      engine-commit:
        description: Original source commit of the reused engine
        type: string
        default: ''

permissions: {}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.nogpu && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: linux-clang,
              os: ubuntu-24.04,
              cc: clang,
              cxx: clang++,
              target: linux-x64,
            }
          - {
              name: linux-gcc,
              os: ubuntu-24.04,
              cc: gcc,
              cxx: g++,
              target: linux-x64,
            }
          - {
              name: linux-lint,
              os: ubuntu-24.04,
              cc: clang,
              cxx: clang++,
              target: linux-x64,
              lint: true,
            }
          - {
              name: linux-nogpu,
              os: ubuntu-24.04,
              cc: clang,
              cxx: clang++,
              target: linux-x64,
              nogpu: true,
            }
          - {
              name: macos,
              os: macos-15,
              cc: clang,
              cxx: clang++,
              target: macos-universal,
            }
          - {
              name: windows,
              os: windows-2025,
              cc: cl,
              cxx: cl,
              target: windows-x64,
            }
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Match the Clang 18 bitcode emitted by JUCE's Release LTO flags.
      LDFLAGS: ${{ matrix.os == 'ubuntu-24.04' && matrix.cc == 'clang' && '-fuse-ld=lld-18' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cache }}
      - name: Setup consumer dependencies
        if: ${{ !matrix.nogpu }}
        uses: ./.github/actions/engine-consumer
        with:
          cache: ${{ inputs.cache }}
      # The no-GPU engine is a custom source build; it has no released archive.
      - name: Setup source engine dependencies
        if: matrix.nogpu
        id: deps
        uses: ./.github/actions/native-deps
        with:
          cache: ${{ inputs.cache }}
          job: linux-nogpu
      - name: Download this checkout's engine
        if: inputs.build-engine && !matrix.nogpu
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Windows has separate artifacts for the dynamic and static C runtimes.
          github-token: ${{ github.token }}
          run-id: ${{ inputs.engine-run-id || github.run_id }}
          pattern: engine-prebuilt-${{ inputs.engine-commit || github.sha }}-${{ matrix.target }}*
          merge-multiple: true
          path: ${{ runner.temp }}/engine-artifacts
      - name: Select this checkout's engine artifacts
        if: inputs.build-engine && !matrix.nogpu
        env:
          ENGINE_COMMIT: ${{ inputs.engine-commit || github.sha }}
        run: |
          node .github/scripts/engine-prebuilts.mjs local-manifest "$RUNNER_TEMP/engine-artifacts" --commit "$ENGINE_COMMIT" --out "$RUNNER_TEMP/engine-manifest.json"
          manifest=$(cygpath -m "$RUNNER_TEMP/engine-manifest.json" 2>/dev/null || echo "$RUNNER_TEMP/engine-manifest.json")
          echo "SOUNDOR_ENGINE_MANIFEST=$manifest" >> "$GITHUB_ENV"
      # The manifest the engine's npm package will carry, from the verified
      # public release (as the release's pack job writes it).
      - name: Select the published prebuilt release
        if: inputs.engine-release != '' && !matrix.nogpu
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.engine-release }}
        run: |
          node .github/scripts/engine-prebuilts.mjs manifest --tag "$TAG" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/engine-manifest.json"
          manifest=$(cygpath -m "$RUNNER_TEMP/engine-manifest.json" 2>/dev/null || echo "$RUNNER_TEMP/engine-manifest.json")
          echo "SOUNDOR_ENGINE_MANIFEST=$manifest" >> "$GITHUB_ENV"
      # CI-only checkout, outside either npm package; never distributed.
      - name: Checkout JUCE integration fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juce-framework/JUCE
          ref: ${{ inputs.juce }}
          path: .soundor/ci-juce
      - name: JUCE platform dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev xvfb
      - name: Use the MSVC toolset asked for
        if: runner.os == 'Windows' && inputs.msvc-toolset != ''
        run: |
          # CMake reads the toolset from the environment only with a generator there.
          echo "CMAKE_GENERATOR=Visual Studio 18 2026" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR_TOOLSET=${{ inputs.msvc-toolset }}" >> "$GITHUB_ENV"
      - name: Use Ninja
        if: runner.os != 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - name: Build workspace
        run: pnpm turbo run build --filter=@soundor/juce-runtime... --filter=@soundor/devtools-client...
      - name: Install native static analysis
        if: matrix.lint
        run: sudo apt-get install -y --no-install-recommends clang-tidy-18 clang-tools-18
      - name: Configure JUCE adapters
        env:
          ENGINE_MODE: ${{ matrix.nogpu && 'source' || 'prebuilt' }}
          ENABLE_GPU: ${{ matrix.nogpu && 'OFF' || 'ON' }}
          CLANG_TIDY: ${{ matrix.lint && 'ON' || 'OFF' }}
        run: |
          cmake -S runtimes/juce-runtime/native -B .soundor/juce-tests -DCMAKE_BUILD_TYPE=Debug -DSOUNDOR_BUILD_TESTS=ON -DSOUNDOR_ENGINE_MODE="$ENGINE_MODE" -DSOUNDOR_ENABLE_GPU="$ENABLE_GPU" -DSOUNDOR_JUCE_CLANG_TIDY="$CLANG_TIDY" -DSOUNDOR_ENABLE_DEVTOOLS=ON -DSOUNDOR_JUCE_TESTS=ON -DJUCE_DIR="$GITHUB_WORKSPACE/.soundor/ci-juce"
      - name: Build and test JUCE adapters
        if: ${{ !matrix.lint }}
        run: |
          cmake --build .soundor/juce-tests --target soundor_juce_tests soundor_juce_platform_tests soundor_juce_state_tests soundor_debug_target --config Debug --parallel 3
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a ctest --test-dir .soundor/juce-tests -C Debug -R '^soundor_(juce_(tests|platform_tests|state_tests)|debug_session)$' --output-on-failure
          else
            ctest --test-dir .soundor/juce-tests -C Debug -R '^soundor_(juce_(tests|platform_tests|state_tests)|debug_session)$' --output-on-failure
          fi
      - name: Native static analysis
        if: matrix.lint
        run: cmake --build .soundor/juce-tests --target soundor_juce_lint --config Debug --parallel 3
      # A plugin as a project builds it by default (juceRuntime's prebuilt
      # mode). Given a manifest, it links those archives, never the engine's
      # sources.
      - name: Configure the test plugin without GPU support
        if: matrix.nogpu
        run: |
          pnpm --filter @soundor/juce-runtime exec soundor init --config tests/plugin/soundor.config.ts
          sed -i '/^include(/i set(SOUNDOR_ENABLE_GPU OFF CACHE BOOL "" FORCE)' runtimes/juce-runtime/tests/plugin/runtimes/juce/CMakeLists.txt
      - name: Build the test plugin
        if: ${{ !matrix.lint }}
        env:
          JUCE_DIR: ${{ github.workspace }}/.soundor/ci-juce
          EXPLICIT_ENGINE: ${{ !matrix.nogpu && (inputs.build-engine || inputs.engine-release != '') && 'true' || '' }}
        run: |
          set -eo pipefail
          pnpm --filter @soundor/juce-runtime test:plugin 2>&1 | tee "$RUNNER_TEMP/plugin.log"
          if [ -n "$EXPLICIT_ENGINE" ]; then
            if grep -qE 'soundor_runtime\.dir|Building (Skia|ANGLE|Hermes)' "$RUNNER_TEMP/plugin.log"; then
              echo "::error::The plugin build compiled the engine instead of linking the prebuilt one"
              exit 1
            fi
            grep -q 'Soundor engine: the release prebuilt' "$RUNNER_TEMP/plugin.log"
          fi
      - name: Check that both builds disabled GPU support
        if: matrix.nogpu
        run: |
          grep -Fx 'SOUNDOR_ENABLE_GPU:BOOL=OFF' .soundor/juce-tests/CMakeCache.txt
          grep -Fx 'SOUNDOR_ENABLE_GPU:BOOL=OFF' runtimes/juce-runtime/tests/plugin/.soundor/cache/juce/build-release/CMakeCache.txt
      - name: The test plugin links as a release should
        if: runner.os == 'Linux' && !matrix.lint
        run: |
          plugin=$(find runtimes/juce-runtime/tests/plugin/.soundor/dist/juce -path '*.vst3/Contents/x86_64-linux/*.so' -type f | head -1)
          [ -n "$plugin" ] || { echo "::error::No VST3 binary found"; exit 1; }
          .github/scripts/linux-plugin-check.sh "$plugin"
      - name: The test plugin needs no C or C++ runtime DLL
        if: runner.os == 'Windows'
        run: |
          plugin=$(find runtimes/juce-runtime/tests/plugin/.soundor/dist/juce -path '*.vst3/Contents/x86_64-win/*.vst3' -type f | head -1)
          [ -n "$plugin" ] || { echo "::error::No VST3 binary found"; exit 1; }
          node .github/scripts/windows-plugin-check.mjs "$plugin"
      # The test plugin's editor, hosted and resized as a DAW does (EditorResize.cpp).
      - name: Resize the test plugin's editor
        if: runner.os == 'Linux' && !matrix.lint
        run: |
          cmake --build .soundor/juce-tests --target soundor_juce_editor_resize --config Debug --parallel 3
          plugin="$(find "$GITHUB_WORKSPACE/runtimes/juce-runtime/tests/plugin/.soundor/dist/juce" -name '*.vst3' -type d | head -1)"
          cd "$RUNNER_TEMP"
          xvfb-run -a -s "-screen 0 1920x1200x24" "$GITHUB_WORKSPACE/.soundor/juce-tests/backend/juce/tests/soundor_juce_editor_resize_artefacts/Debug/soundor_juce_editor_resize" "$plugin"
      - name: Save source engine dependencies
        if: always() && matrix.nogpu && steps.deps.outputs.cache-key != ''
        uses: ./.github/actions/native-deps-save
        with:
          key: ${{ steps.deps.outputs.cache-key }}
          restored: ${{ steps.deps.outputs.cache-matched-key }}
