name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run formatter
        run: pnpm exec biome check . --linter-enabled=false

      - name: Run linter
        run: pnpm run lint

      - name: Run build
        run: pnpm run build
