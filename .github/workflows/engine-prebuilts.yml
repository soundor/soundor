name: Engine prebuilts

# The native libraries of @soundor/engine as a GitHub release,
# engine-prebuilts-v<version>-<short sha>-r<revision> (engines/engine/README.md,
# "Prebuilt engines"). Modes:
#
#   validate  build, test and pack every archive; keep them as run artifacts
#             only (by hand)
#   stage     validate, then upload them to a draft release, verify it and
#             delete it: the release path, without publishing (main only)
#   publish   validate, then publish the release and verify its public assets
#             (main only, and only from the release workflow)
#
# The release workflow calls it in two phases, so that it publishes nothing
# before every package it releases has passed its tests: `build` plans, builds
# and tests the archives (run artifacts); `release` plans again and releases
# those same artifacts. A run by hand (validate, stage) does both.
#
# A published release of the same version, commit and revision is verified
# and reused, never rebuilt or replaced; a draft left by an interrupted run is
# finished. A defective published release needs a higher revision (the release
# workflow's engine-revision).

on:
  workflow_dispatch:
    inputs:
      tests:
        description: Run native tests
        type: boolean
        default: true
      mode:
        description: validate, or stage (draft release, then deleted)
        type: choice
        options: [validate, stage]
        default: validate
      revision:
        description: Build revision (empty, the highest published one or 1)
        type: string
        default: ''
  workflow_call:
    inputs:
      mode:
        type: string
        default: publish
      phase:
        description: build (plan, build and test the archives) or release (release them)
        type: string
        required: true
      revision:
        type: string
        default: ''
    outputs:
      tag:
        description: The prebuilt release of this commit
        value: ${{ jobs.result.outputs.tag }}
      action:
        description: build (this run's archives) or reuse (the published release)
        value: ${{ jobs.result.outputs.action }}

concurrency:
  # One run per commit, mode and phase at a time. Releases are never
  # cancelled halfway.
  group: engine-prebuilts-${{ github.sha }}-${{ inputs.mode || 'validate' }}-${{ inputs.phase || 'all' }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Validation needs no GitHub access: build revision 1 of this commit.
  plan-validate:
    name: Plan
    if: (inputs.mode || 'validate') == 'validate' && inputs.phase != 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      action: build
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: |
          node --input-type=module -e "
            import { appendFileSync } from 'node:fs';
            import { engineVersion, plan } from './.github/scripts/engine-prebuilts.mjs';
            const planned = plan({ version: engineVersion(), commit: process.env.GITHUB_SHA, revision: 1 });
            appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + planned.tag + '\n');
            console.log(planned.tag);"

  # A release is planned against the releases that exist (drafts included,
  # which only a token that can write sees), from main only. The release
  # phase plans again: nothing is released between the two phases, so it
  # decides the same.
  plan-release:
    name: Plan release
    if: inputs.mode == 'stage' || inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      action: ${{ steps.plan.outputs.action }}
      tag: ${{ steps.plan.outputs.tag }}
      draft: ${{ steps.plan.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Only main's commits are released
        run: |
          git fetch --quiet origin main
          if [ "$GITHUB_REF" != "refs/heads/main" ] || ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Engine prebuilts are released from main only ($GITHUB_REF, $GITHUB_SHA)"
            exit 1
          fi
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: node .github/scripts/engine-prebuilts.mjs plan --commit "$GITHUB_SHA" ${REVISION:+--revision "$REVISION"}

  build:
    name: Build engine artifacts
    needs: [plan-validate, plan-release]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      inputs.phase != 'release' &&
      (needs.plan-validate.outputs.action || needs.plan-release.outputs.action) == 'build'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/engine.yml
    with:
      release-build: true
      # Only a validate run by hand can leave them out.
      tests: ${{ inputs.mode != 'validate' || inputs.tests != false }}

  # Every archive of every target, checked as one set, then released. Nothing
  # is uploaded unless all of them were built and passed: in this run, or in
  # the build phase the release workflow ran before it.
  release:
    name: Release
    needs: [plan-release, build]
    if: >-
      always() && !cancelled() && inputs.phase != 'build' &&
      needs.plan-release.result == 'success' &&
      needs.plan-release.outputs.action == 'build' &&
      (needs.build.result == 'success' || inputs.phase == 'release')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-prebuilt-${{ github.sha }}-*
          path: ${{ runner.temp }}/prebuilts
          merge-multiple: true
      - name: Assemble and release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan-release.outputs.tag }}
          DRAFT: ${{ needs.plan-release.outputs.draft }}
          MODE: ${{ inputs.mode }}
        run: |
          set -eo pipefail
          revision=${TAG##*-r}
          assets="$RUNNER_TEMP/assets"
          node .github/scripts/engine-prebuilts.mjs assemble "$RUNNER_TEMP/prebuilts" "$assets" --commit "$GITHUB_SHA" --revision "$revision"
          cp "$RUNNER_TEMP"/prebuilts/*.tar.gz "$assets/"
          node .github/scripts/engine-prebuilts.mjs release "$assets" --commit "$GITHUB_SHA" --revision "$revision" --mode "$MODE" ${DRAFT:+--draft "$DRAFT"} | tee "$RUNNER_TEMP/release.txt"
          {
            echo "### Engine prebuilts: $MODE"
            echo
            echo "\`$TAG\`"
            echo
            cat "$assets/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^immutable=false$' "$RUNNER_TEMP/release.txt"; then
            echo "::warning::$TAG is published but not immutable: enable release immutability in the repository settings"
          fi

  result:
    name: Result
    needs: [plan-validate, plan-release, build, release]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ needs.plan-release.outputs.tag || needs.plan-validate.outputs.tag }}
      action: ${{ needs.plan-release.outputs.action || needs.plan-validate.outputs.action }}
    steps:
      - name: Require every applicable job
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          case "$RESULTS" in
            *failure*|*cancelled*) echo "Engine prebuilts did not complete: $RESULTS"; exit 1 ;;
            *) echo "Engine prebuilts complete: $RESULTS" ;;
          esac
