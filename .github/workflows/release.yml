name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false
          registry-url: https://registry.npmjs.org

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run version
          publish-script: pnpm release
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
        env:
          # changesets/action v2 no longer writes .npmrc from NPM_TOKEN; the
          # setup step's registry-url makes npm read NODE_AUTH_TOKEN instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
