name: Release

# Changesets, in its steps (changesets/action v2's sub-actions). Publish mode
# builds, then tests, then publishes: nothing is published, not even the
# engine's prebuilt release, before every check of every package it releases
# has passed.
#
#   select    version (changesets pending), publish (versions not on npm) or none
#   version   create or update the release pull request
#
# Build, each package with its own tests:
#
#   validate  this publishing commit's package format, lint, build and unit tests
#   engine    when @soundor/engine is to be published: its prebuilt archives
#             for this commit, built and tested (engine-prebuilts.yml, phase
#             build), or its published prebuilt release, verified and reused
#   host-artifacts  when @soundor/vst3-host is to be published: its executables
#             for this commit, built and tested (vst3-host-artifacts.yml)
#
# Test what uses them:
#
#   juce, juce9  when @soundor/engine or @soundor/juce-runtime is to be
#             published: the JUCE adapters and a real plugin on each JUCE
#             version, linked to the engine to be published (juce.yml)
#
# Publish, once all of the above passed:
#
#   engine-release  the engine's prebuilt release, from the archives tested
#             above (engine-prebuilts.yml, phase release)
#   pack      build, write the engine's artifacts/manifest.json from the
#             verified public release, generate and pack the VST3 host's
#             platform packages from those executables and pin them in the
#             host's manifest, pack the planned packages, and check the packed
#             engine and host
#   publish   publish the host's platform packages (resumable: what is on npm
#             is verified, never replaced) and check all are there; then
#             publish exactly the planned tarballs to npm, the host last of
#             its family; tag and create a GitHub release per package
#   website   deploy soundor.dev from the released commit (website.yml), so
#             the docs describe what npm has
#
# npm is published only once the engine's binaries are publicly downloadable.
# A failed run is safe to repeat: a published prebuilt release is reused,
# npm never republishes a version, and versions already published leave the
# plan.

on:
  push:
    branches:
      - main
  # A rerun from main; with engine-revision, to replace a defective prebuilt
  # release of an engine version not yet on npm.
  workflow_dispatch:
    inputs:
      engine-revision:
        description: Engine prebuilt build revision (empty, the highest published one or 1)
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  select:
    name: Select
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish-plan: ${{ steps.mode.outputs.publish-plan-artifact-id }}
      engine: ${{ steps.engine.outputs.engine || 'false' }}
      juce: ${{ steps.juce.outputs.juce || 'false' }}
      host: ${{ steps.host.outputs.host || 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Select the mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      # The same plan select-mode made: does it publish @soundor/engine?
      - name: Is the engine released
        id: engine
        if: steps.mode.outputs.mode == 'publish'
        run: |
          pnpm changeset publish-plan --output "$RUNNER_TEMP/publish-plan.json"
          node .github/scripts/engine-prebuilts.mjs planned-engine "$RUNNER_TEMP/publish-plan.json"

      # The same plan: does it publish @soundor/juce-runtime?
      - name: Is the JUCE runtime released
        id: juce
        if: steps.mode.outputs.mode == 'publish'
        run: |
          node --input-type=module -e "
            import { appendFileSync, readFileSync } from 'node:fs';
            const { version, plan } = JSON.parse(readFileSync(process.argv[1], 'utf8'));
            if (version !== 1 || !Array.isArray(plan)) throw new Error('Unknown Changesets publish plan format');
            const juce = plan.flat().some((e) => e.kind === 'publish' && e.name === '@soundor/juce-runtime');
            appendFileSync(process.env.GITHUB_OUTPUT, 'juce=' + juce + '\\n');
            console.log('juce=' + juce);" "$RUNNER_TEMP/publish-plan.json"

      # The same plan: does it publish @soundor/vst3-host?
      - name: Is the VST3 host released
        id: host
        if: steps.mode.outputs.mode == 'publish'
        run: node hosts/vst3-host/scripts/release.ts planned "$RUNNER_TEMP/publish-plan.json"

  version:
    name: Version
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Create or update the release pull request
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'

  validate:
    name: Validate release packages
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja
      SOUNDOR_YOGA_WASM: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache: false
      - name: Format, lint, build and test
        run: pnpm run check

      # Release does not wait for Verify: the engine's Yoga is released on its
      # own, and the web runtime's must follow.
      - name: The web runtime's Yoga is the engine's
        run: node engines/yoga-wasm/scripts/check-release.mjs

  # ── Build ──────────────────────────────────────────────────────────────
  # This pipeline builds and tests every native binary it publishes.

  engine:
    name: Engine
    needs: [select, validate]
    if: needs.select.outputs.mode == 'publish' && needs.select.outputs.engine == 'true'
    permissions:
      # Plans against the existing releases, drafts included.
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/engine-prebuilts.yml
    with:
      mode: publish
      phase: build
      revision: ${{ inputs.engine-revision || '' }}

  host-artifacts:
    name: VST3 host artifacts
    needs: [select, validate]
    if: needs.select.outputs.mode == 'publish' && needs.select.outputs.host == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vst3-host-artifacts.yml
    with:
      cache: false
      checks: false

  # ── Test what uses them ────────────────────────────────────────────────
  # The engine to be published: this run's archives, or the published
  # prebuilt release it reuses; the released engine when only the JUCE
  # runtime is published. The JUCE versions are Verify's.

  juce:
    name: JUCE 8
    needs: [select, validate, engine]
    if: >-
      always() && !cancelled() && needs.select.outputs.mode == 'publish' &&
      needs.validate.result == 'success' &&
      (needs.select.outputs.engine == 'true' || needs.select.outputs.juce == 'true') &&
      (needs.select.outputs.engine != 'true' || needs.engine.result == 'success')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/juce.yml
    with:
      juce: 2cdfca8feb300fb424002ba2c2751569e5bacb64 # 8.0.14
      msvc-toolset: v143,version=14.44
      cache: false
      build-engine: ${{ needs.select.outputs.engine == 'true' && needs.engine.outputs.action == 'build' }}
      engine-release: ${{ needs.select.outputs.engine == 'true' && needs.engine.outputs.action == 'reuse' && needs.engine.outputs.tag || '' }}

  juce9:
    name: JUCE 9
    needs: [select, validate, engine]
    if: >-
      always() && !cancelled() && needs.select.outputs.mode == 'publish' &&
      needs.validate.result == 'success' &&
      (needs.select.outputs.engine == 'true' || needs.select.outputs.juce == 'true') &&
      (needs.select.outputs.engine != 'true' || needs.engine.result == 'success')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/juce.yml
    with:
      juce: 3fb5cbc0340758596dac39f7c8de47d562b4896e # 9.0.4
      cache: false
      build-engine: ${{ needs.select.outputs.engine == 'true' && needs.engine.outputs.action == 'build' }}
      engine-release: ${{ needs.select.outputs.engine == 'true' && needs.engine.outputs.action == 'reuse' && needs.engine.outputs.tag || '' }}

  # ── Publish ────────────────────────────────────────────────────────────
  # Every job above, for what this release publishes, has passed.

  engine-release:
    name: Engine prebuilt release
    needs: [select, validate, engine, host-artifacts, juce, juce9]
    if: >-
      always() && !cancelled() && needs.select.outputs.mode == 'publish' &&
      needs.select.outputs.engine == 'true' &&
      needs.validate.result == 'success' && needs.engine.result == 'success' &&
      needs.juce.result == 'success' && needs.juce9.result == 'success' &&
      (needs.select.outputs.host != 'true' || needs.host-artifacts.result == 'success')
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/engine-prebuilts.yml
    with:
      mode: publish
      phase: release
      revision: ${{ inputs.engine-revision || '' }}

  pack:
    name: Pack
    needs:
      [select, validate, engine, host-artifacts, juce, juce9, engine-release]
    if: >-
      always() && !cancelled() && needs.select.outputs.mode == 'publish' &&
      needs.validate.result == 'success' &&
      (needs.select.outputs.engine != 'true' || needs.engine-release.result == 'success') &&
      (needs.select.outputs.engine != 'true' && needs.select.outputs.juce != 'true' ||
        needs.juce.result == 'success' && needs.juce9.result == 'success') &&
      (needs.select.outputs.host != 'true' || needs.host-artifacts.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pack-dir: ${{ steps.pack.outputs.pack-dir-artifact-id }}
      host-tarballs: ${{ steps.host-tarballs.outputs.artifact-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Build
        env:
          SOUNDOR_YOGA_WASM: release
        run: pnpm build

      - name: The packed Yoga was compiled for this release
        run: node engines/yoga-wasm/scripts/check-release.mjs --built

      # Never committed: written from the release, which is downloaded
      # anonymously and checked against build-info.json first.
      - name: The engine's prebuilt manifest
        if: needs.select.outputs.engine == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.engine-release.outputs.tag }}
        run: node .github/scripts/engine-prebuilts.mjs manifest --tag "$TAG" --commit "$GITHUB_SHA" --out engines/engine/artifacts/manifest.json

      # Every target's validated executable of this commit, from this run.
      - name: Download the VST3 host's executables
        if: needs.select.outputs.host == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vst3-host-${{ github.sha }}-*
          path: ${{ runner.temp }}/vst3-host-artifacts

      # Generated, packed and checked before the main package is packed; its
      # manifest then pins them (never committed).
      - name: The VST3 host's platform packages
        if: needs.select.outputs.host == 'true'
        run: |
          set -eo pipefail
          artifacts="$RUNNER_TEMP/vst3-host-artifacts"
          for directory in "$artifacts"/vst3-host-"$GITHUB_SHA"-*; do
            mv "$directory" "$artifacts/${directory##*/vst3-host-$GITHUB_SHA-}"
          done
          node hosts/vst3-host/scripts/release.ts generate "$artifacts" --out "$RUNNER_TEMP/vst3-host-packages" --commit "$GITHUB_SHA"
          node hosts/vst3-host/scripts/release.ts pack "$RUNNER_TEMP/vst3-host-packages" --out "$RUNNER_TEMP/vst3-host-tarballs" --commit "$GITHUB_SHA"
          node hosts/vst3-host/scripts/release.ts add-optional-dependencies

      - name: Keep the platform packages
        id: host-tarballs
        if: needs.select.outputs.host == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vst3-host-platform-packages-${{ github.sha }}
          path: ${{ runner.temp }}/vst3-host-tarballs
          if-no-files-found: error

      - name: Pack
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select.outputs.publish-plan }}

      - name: Download the packed packages
        if: needs.select.outputs.engine == 'true' || needs.select.outputs.host == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/packed

      - name: The packed engine carries the manifest
        if: needs.select.outputs.engine == 'true'
        run: node .github/scripts/engine-prebuilts.mjs check-pack "$RUNNER_TEMP/packed" engines/engine/artifacts/manifest.json

      - name: The packed VST3 host pins its platform packages
        if: needs.select.outputs.host == 'true'
        run: node hosts/vst3-host/scripts/release.ts check-main "$RUNNER_TEMP/packed"

  publish:
    name: Publish
    # npm trusted publishing authenticates both publish steps through OIDC.
    environment: npm-production
    needs: [select, pack]
    if: always() && !cancelled() && needs.pack.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Download the VST3 host's platform packages
        if: needs.select.outputs.host == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.host-tarballs }}
          path: ${{ runner.temp }}/vst3-host-tarballs

      # Before the main package, which pins them: a version already on npm is
      # verified (same native inputs) and skipped, never replaced; a missing
      # one is published. A failure leaves the main package unpublished, so
      # the next run resumes here.
      - name: Publish the VST3 host's platform packages
        if: needs.select.outputs.host == 'true'
        run: |
          node hosts/vst3-host/scripts/release.ts publish "$RUNNER_TEMP/vst3-host-tarballs" --commit "$GITHUB_SHA"
          node hosts/vst3-host/scripts/release.ts verify "$RUNNER_TEMP/vst3-host-tarballs" --commit "$GITHUB_SHA"

      - name: Publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir }}

  website:
    name: Website
    needs: publish
    if: always() && !cancelled() && needs.publish.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    with:
      cache: false
      ref: ${{ github.sha }}
