name: Release

# Changesets, in its steps (changesets/action v2's sub-actions). Publish mode
# builds, then tests, then publishes: nothing is published, not even the
# engine's prebuilt release, before every check of every package it releases
# has passed.
#
#   select    version (changesets pending), publish (versions not on npm) or none
#   version   create or update the release pull request
#
# Build, each package with its own tests:
#
#   validate  this publishing commit's package format, lint, build and unit tests
#   engine    when @soundor/engine is to be published: its prebuilt archives
#             for this commit (native and WebAssembly), built and tested
#             (engine-prebuilts.yml, phase build), or its published prebuilt
#             release, verified and reused
#   host-artifacts  when @soundor/vst3-host is to be published: its executables
#             for this commit, built and tested (vst3-host-artifacts.yml)
#
# Test what uses them:
#
#   vst3      when @soundor/engine or @soundor/vst3-runtime is to be
#             published: the VST3 runtime's prebuilt adapters (Linux, macOS,
#             Windows), built against the engine to be published, its test
#             plugin in the VST3 host and pluginval (vst3.yml), packed as the
#             archives of their release
#
# Publish, once all of the above passed:
#
#   engine-release  the engine's prebuilt release, from the archives tested
#             above (engine-prebuilts.yml, phase release)
#   vst3-release  the VST3 runtime's adapter release, from the archives
#             tested above (vst3-adapters.mjs), when it is to be published
#   pack      build, write the engine's and the VST3 runtime's
#             artifacts/manifest.json from their verified public releases,
#             generate and pack the VST3 host's
#             platform packages from those executables and pin them in the
#             host's manifest, pack the planned packages, check the packed
#             engine, VST3 runtime and host, and only then upload the tarballs
#   publish   publish the host's platform packages (resumable: what is on npm
#             is verified, never replaced) and check all are there; then
#             publish exactly the planned tarballs to npm, the host last of
#             its family; tag and create a GitHub release per package
#   website   deploy soundor.dev from the released commit (website.yml), so
#             the docs describe what npm has
#
# npm is published only once the engine's binaries and the VST3 runtime's
# adapters are publicly downloadable.
# A failed run is safe to repeat: a published prebuilt release is reused,
# npm never republishes a version, and versions already published leave the
# plan.

on:
  push:
    branches:
      - main
  # A rerun from main; with engine-revision, to replace a defective prebuilt
  # release of an engine version not yet on npm.
  workflow_dispatch:
    inputs:
      engine-revision:
        description: Engine prebuilt build revision (empty, the highest published one or 1)
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  select:
    name: Select
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish-plan: ${{ steps.mode.outputs.publish-plan-artifact-id }}
      engine: ${{ steps.engine.outputs.engine || 'false' }}
      host: ${{ steps.host.outputs.host || 'false' }}
      vst3: ${{ steps.vst3.outputs.vst3 || 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Select the mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      # The same plan select-mode made: does it publish @soundor/engine?
      - name: Is the engine released
        id: engine
        if: steps.mode.outputs.mode == 'publish'
        run: |
          pnpm changeset publish-plan --output "$RUNNER_TEMP/publish-plan.json"
          node .github/scripts/engine-prebuilts.mjs planned-engine "$RUNNER_TEMP/publish-plan.json"

      # The same plan: does it publish @soundor/vst3-runtime?
      - name: Is the VST3 runtime released
        id: vst3
        if: steps.mode.outputs.mode == 'publish'
        run: |
          node --input-type=module -e "
            import { appendFileSync, readFileSync } from 'node:fs';
            const { version, plan } = JSON.parse(readFileSync(process.argv[1], 'utf8'));
            if (version !== 1 || !Array.isArray(plan)) throw new Error('Unknown Changesets publish plan format');
            const vst3 = plan.flat().some((e) => e.kind === 'publish' && e.name === '@soundor/vst3-runtime');
            appendFileSync(process.env.GITHUB_OUTPUT, 'vst3=' + vst3 + '\\n');
            console.log('vst3=' + vst3);" "$RUNNER_TEMP/publish-plan.json"

      # The same plan: does it publish @soundor/vst3-host?
      - name: Is the VST3 host released
        id: host
        if: steps.mode.outputs.mode == 'publish'
        run: node hosts/vst3-host/scripts/release.ts planned "$RUNNER_TEMP/publish-plan.json"

  version:
    name: Version
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Create or update the release pull request
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'

  validate:
    name: Validate release packages
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache: false
      - name: Rust for WebAssembly
        run: rustup target add wasm32-unknown-unknown

      # The web runtime's tests lay out with the engine's WebAssembly core,
      # built from this commit when it publishes a new engine version.
      - uses: ./.github/actions/emsdk
      - name: Format, lint, build and test
        run: pnpm run check

  # ── Build ──────────────────────────────────────────────────────────────
  # This pipeline builds and tests every native binary it publishes.

  engine:
    name: Engine
    needs: [select, validate]
    if: needs.select.outputs.mode == 'publish' && needs.select.outputs.engine == 'true'
    permissions:
      # Plans against the existing releases, drafts included.
      contents: write
      actions: read
    uses: ./.github/workflows/engine-prebuilts.yml
    with:
      mode: publish
      phase: build
      revision: ${{ inputs.engine-revision || '' }}

  host-artifacts:
    name: VST3 host artifacts
    needs: [select, validate]
    if: needs.select.outputs.mode == 'publish' && needs.select.outputs.host == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vst3-host-artifacts.yml
    with:
      cache: false
      checks: false

  # ── Test what uses them ────────────────────────────────────────────────
  # The engine to be published: this run's archives, or the published
  # prebuilt release it reuses; the released engine when only the VST3
  # runtime is published.

  # The VST3 runtime's prebuilt adapters, which its package's manifest
  # names: built against the engine it pins (this run's archives, or the
  # published release), tested, validated by pluginval, and packed for
  # vst3-release. An engine release runs it too: the engine is tested in a
  # real plugin before it is published.
  vst3:
    name: VST3 runtime
    needs: [select, validate, engine, host-artifacts]
    if: >-
      always() && !cancelled() && needs.select.outputs.mode == 'publish' &&
      (needs.select.outputs.vst3 == 'true' || needs.select.outputs.engine == 'true') &&
      needs.validate.result == 'success' &&
      (needs.select.outputs.engine != 'true' || needs.engine.result == 'success') &&
      (needs.select.outputs.host != 'true' || needs.host-artifacts.result == 'success')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/vst3.yml
    with:
      cache: false
      build-engine: ${{ needs.select.outputs.engine == 'true' && needs.engine.outputs.action == 'build' }}
      engine-release: ${{ needs.select.outputs.engine == 'true' && needs.engine.outputs.action == 'reuse' && needs.engine.outputs.tag || '' }}
      build-host: ${{ needs.select.outputs.host == 'true' }}
      keep-adapter: true
      # An author on Visual Studio 2022 links the Windows adapter.
      msvc-toolset: v143,version=14.44

  # ── Publish ────────────────────────────────────────────────────────────
  # Every job above, for what this release publishes, has passed.

  engine-release:
    name: Engine prebuilt release
    needs: [select, validate, engine, host-artifacts, vst3]
    if: >-
      always() && !cancelled() && needs.select.outputs.mode == 'publish' &&
      needs.select.outputs.engine == 'true' &&
      needs.validate.result == 'success' && needs.engine.result == 'success' &&
      needs.vst3.result == 'success' &&
      (needs.select.outputs.host != 'true' || needs.host-artifacts.result == 'success')
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/engine-prebuilts.yml
    with:
      mode: publish
      phase: release
      revision: ${{ inputs.engine-revision || '' }}

  # The adapters every VST3 job built and tested, as one GitHub release
  # (vst3-adapters-v<version>-<short sha>-r<revision>), from main only. A
  # published release of this version and commit is verified and reused,
  # never replaced; a draft left by an interrupted run is finished.
  vst3-release:
    name: VST3 adapter release
    needs: [select, validate, engine, host-artifacts, engine-release, vst3]
    if: >-
      always() && !cancelled() && needs.select.outputs.mode == 'publish' &&
      needs.select.outputs.vst3 == 'true' &&
      needs.validate.result == 'success' && needs.vst3.result == 'success' &&
      (needs.select.outputs.engine != 'true' || needs.engine-release.result == 'success') &&
      (needs.select.outputs.host != 'true' || needs.host-artifacts.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Only main's commits are released
        run: |
          git fetch --quiet origin main
          if [ "$GITHUB_REF" != "refs/heads/main" ] || ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::VST3 adapters are released from main only ($GITHUB_REF, $GITHUB_SHA)"
            exit 1
          fi
      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/vst3-adapters.mjs plan --commit "$GITHUB_SHA"
      - name: Download the adapters
        if: steps.plan.outputs.action == 'build'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vst3-adapter-${{ github.sha }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/vst3-adapters
      - name: Assemble and release
        if: steps.plan.outputs.action == 'build'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          DRAFT: ${{ steps.plan.outputs.draft }}
        run: |
          set -eo pipefail
          revision=${TAG##*-r}
          assets="$RUNNER_TEMP/assets"
          node .github/scripts/vst3-adapters.mjs assemble "$RUNNER_TEMP/vst3-adapters" "$assets" --commit "$GITHUB_SHA" --revision "$revision"
          cp "$RUNNER_TEMP"/vst3-adapters/*.tar.gz "$assets/"
          node .github/scripts/vst3-adapters.mjs release "$assets" --commit "$GITHUB_SHA" --revision "$revision" --mode publish ${DRAFT:+--draft "$DRAFT"} | tee "$RUNNER_TEMP/release.txt"
          {
            echo "### VST3 adapters"
            echo
            echo "\`$TAG\`"
            echo
            cat "$assets/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^immutable=false$' "$RUNNER_TEMP/release.txt"; then
            echo "::warning::$TAG is published but not immutable: enable release immutability in the repository settings"
          fi

  pack:
    name: Pack
    needs:
      [
        select,
        validate,
        engine,
        host-artifacts,
        engine-release,
        vst3,
        vst3-release,
      ]
    if: >-
      always() && !cancelled() && needs.select.outputs.mode == 'publish' &&
      needs.validate.result == 'success' &&
      (needs.select.outputs.vst3 != 'true' && needs.select.outputs.engine != 'true' ||
        needs.vst3.result == 'success') &&
      (needs.select.outputs.engine != 'true' || needs.engine-release.result == 'success') &&
      (needs.select.outputs.vst3 != 'true' || needs.vst3-release.result == 'success') &&
      (needs.select.outputs.host != 'true' || needs.host-artifacts.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pack-dir: ${{ steps.pack.outputs.artifact-id }}
      host-tarballs: ${{ steps.host-tarballs.outputs.artifact-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Build
        run: pnpm build

      # Never committed: written from the release, which is downloaded
      # anonymously and checked against build-info.json first.
      - name: The engine's prebuilt manifest
        if: needs.select.outputs.engine == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.engine-release.outputs.tag }}
        run: node .github/scripts/engine-prebuilts.mjs manifest --tag "$TAG" --commit "$GITHUB_SHA" --out engine/artifacts/manifest.json

      # Every target's validated executable of this commit, from this run.
      - name: Download the VST3 host's executables
        if: needs.select.outputs.host == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vst3-host-${{ github.sha }}-*
          path: ${{ runner.temp }}/vst3-host-artifacts

      # Generated, packed and checked before the main package is packed; its
      # manifest then pins them (never committed).
      - name: The VST3 host's platform packages
        if: needs.select.outputs.host == 'true'
        run: |
          set -eo pipefail
          artifacts="$RUNNER_TEMP/vst3-host-artifacts"
          for directory in "$artifacts"/vst3-host-"$GITHUB_SHA"-*; do
            mv "$directory" "$artifacts/${directory##*/vst3-host-$GITHUB_SHA-}"
          done
          node hosts/vst3-host/scripts/release.ts generate "$artifacts" --out "$RUNNER_TEMP/vst3-host-packages" --commit "$GITHUB_SHA"
          node hosts/vst3-host/scripts/release.ts pack "$RUNNER_TEMP/vst3-host-packages" --out "$RUNNER_TEMP/vst3-host-tarballs" --commit "$GITHUB_SHA"
          node hosts/vst3-host/scripts/release.ts add-optional-dependencies

      - name: Keep the platform packages
        id: host-tarballs
        if: needs.select.outputs.host == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vst3-host-platform-packages-${{ github.sha }}
          path: ${{ runner.temp }}/vst3-host-tarballs
          if-no-files-found: error

      # Never committed: the adapters' release, downloaded anonymously and
      # checked against build-info.json first. The package carries no adapter.
      - name: The VST3 runtime's adapter manifest
        if: needs.select.outputs.vst3 == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.vst3-release.outputs.tag }}
        run: node .github/scripts/vst3-adapters.mjs manifest --tag "$TAG" --commit "$GITHUB_SHA" --out runtimes/vst3-runtime/artifacts/manifest.json

      - name: Download the publish plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.select.outputs.publish-plan }}
          path: ${{ runner.temp }}/publish-plan

      # changeset pack itself, not changesets/action/pack, which uploads as
      # it packs: the tarballs are checked here first and uploaded only once
      # every check has passed, in the layout the publish sub-action reads.
      - name: Pack
        run: pnpm changeset pack --from-publish-plan "$RUNNER_TEMP/publish-plan/publish-plan.json" --out-dir "$RUNNER_TEMP/packed"

      - name: The packed engine carries the manifest
        if: needs.select.outputs.engine == 'true'
        run: node .github/scripts/engine-prebuilts.mjs check-pack "$RUNNER_TEMP/packed" engine/artifacts/manifest.json

      - name: The packed VST3 runtime carries the adapter manifest
        if: needs.select.outputs.vst3 == 'true'
        run: node .github/scripts/vst3-adapters.mjs check-pack "$RUNNER_TEMP/packed" runtimes/vst3-runtime/artifacts/manifest.json

      - name: The packed VST3 host pins its platform packages
        if: needs.select.outputs.host == 'true'
        run: node hosts/vst3-host/scripts/release.ts check-main "$RUNNER_TEMP/packed"

      - name: Keep the packed packages
        id: pack
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changeset-pack-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packed
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish
    # npm trusted publishing authenticates both publish steps through OIDC.
    environment: npm-production
    needs: [select, pack]
    if: always() && !cancelled() && needs.pack.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: false

      - name: Download the VST3 host's platform packages
        if: needs.select.outputs.host == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.host-tarballs }}
          path: ${{ runner.temp }}/vst3-host-tarballs

      # Before the main package, which pins them: a version already on npm is
      # verified (same native inputs) and skipped, never replaced; a missing
      # one is published. A failure leaves the main package unpublished, so
      # the next run resumes here.
      - name: Publish the VST3 host's platform packages
        if: needs.select.outputs.host == 'true'
        run: |
          node hosts/vst3-host/scripts/release.ts publish "$RUNNER_TEMP/vst3-host-tarballs" --commit "$GITHUB_SHA"
          node hosts/vst3-host/scripts/release.ts verify "$RUNNER_TEMP/vst3-host-tarballs" --commit "$GITHUB_SHA"

      - name: Publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir }}

  website:
    name: Website
    needs: publish
    if: always() && !cancelled() && needs.publish.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    with:
      cache: false
      ref: ${{ github.sha }}
