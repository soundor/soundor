name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Native checks (clang-format, clang-tidy, native tests) use the same
      # Clang 18 toolchain as local development.
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Skia
        uses: ./.github/actions/skia
        with:
          job: verify

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Run formatter
        run: pnpm run format

      - name: Run linter
        run: pnpm run lint

      - name: Run build
        run: pnpm run build

      - name: Run test
        run: pnpm run test

  native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            preset: dev
            cc: gcc
            cxx: g++
          - name: linux-sanitizers
            os: ubuntu-24.04
            preset: sanitize
            cc: clang
            cxx: clang++
          - name: macos
            os: macos-15
            preset: dev
            cc: clang
            cxx: clang++
          - name: windows
            os: windows-2025
            preset: dev
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    defaults:
      run:
        working-directory: runtimes/juce-runtime/native
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Skia
        uses: ./.github/actions/skia
        with:
          job: ${{ matrix.name }}

      - name: Build and test the native runtime
        run: cmake --workflow --preset ${{ matrix.preset }}
