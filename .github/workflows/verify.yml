name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Native checks (clang-format, clang-tidy, native tests) use the same
      # Clang 18 toolchain as local development.
      CC: clang
      CXX: clang++
      # Without it CMake defaults to Makefiles, which build one file at a time;
      # the native-deps action installs Ninja.
      CMAKE_GENERATOR: Ninja
      # GPU tests run on Mesa's lavapipe; without a device they fail, not skip.
      SOUNDOR_REQUIRE_GPU: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup native dependencies
        uses: ./.github/actions/native-deps
        with:
          job: verify

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Each step keeps its output for "Report the failure".
      - name: Run formatter
        run: set -o pipefail; pnpm run format 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Run linter
        run: set -o pipefail; pnpm run lint 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Run build
        run: set -o pipefail; pnpm run build 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Run test
        run: set -o pipefail; pnpm run test 2>&1 | tee "$RUNNER_TEMP/step.log"

      # The end of a failed step's output as an annotation: shown on the PR's
      # checks, and readable through the API without downloading the log.
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          tail -n 80 "$RUNNER_TEMP/step.log" | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > "$RUNNER_TEMP/tail.txt"
          echo "::error title=${{ github.job }} failed::$(cat "$RUNNER_TEMP/tail.txt")"

  native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            preset: dev
            cc: gcc
            cxx: g++
          - name: linux-sanitizers
            os: ubuntu-24.04
            preset: sanitize
            cc: clang
            cxx: clang++
          - name: macos
            os: macos-15
            preset: dev
            cc: clang
            cxx: clang++
          - name: windows
            os: windows-2025
            preset: dev
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # GPU tests need a device (lavapipe on Linux, WARP on Windows, Metal on
      # macOS); without one they fail, not skip.
      SOUNDOR_REQUIRE_GPU: '1'
    defaults:
      run:
        working-directory: runtimes/juce-runtime/native
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup native dependencies
        uses: ./.github/actions/native-deps
        with:
          job: ${{ matrix.name }}

      - name: Build and test the native runtime
        shell: bash
        run: set -o pipefail; cmake --workflow --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/step.log"

      # The end of a failed step's output as an annotation: shown on the PR's
      # checks, and readable through the API without downloading the log.
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          tail -n 80 "$RUNNER_TEMP/step.log" | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > "$RUNNER_TEMP/tail.txt"
          echo "::error title=${{ github.job }} failed::$(cat "$RUNNER_TEMP/tail.txt")"
