name: Verify

on:
  workflow_call:
    outputs:
      host:
        description: Whether this run built and tested the VST3 host's artifacts
        value: ${{ jobs.host-plan.outputs.build }}
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Native input detection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      native: ${{ steps.detect.outputs.native }}
      juce: ${{ steps.detect.outputs.juce }}
      benchmark: ${{ steps.detect.outputs.benchmark }}
      host: ${{ steps.detect.outputs.host }}
      orbit: ${{ steps.detect.outputs.orbit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/native-changes.mjs

  engine-plan:
    name: Select engine
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' || needs.changes.outputs.juce == 'true' ||
      needs.changes.outputs.orbit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/soundor-cache/engine-manifests
          key: engine-manifests-${{ hashFiles('runtimes/engine/package.json') }}
      - id: select
        env:
          ENGINE_AFFECTED: ${{ needs.changes.outputs.native }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { selectEngine } from "./runtimes/engine/scripts/engine-selection.mjs";
            const selection = process.env.ENGINE_AFFECTED === "true"
              ? { mode: "source", reason: "engine package affected" }
              : await selectEngine("runtimes/engine", process.env.RUNNER_TEMP + "/soundor-cache");
            console.log(selection);
            appendFileSync(process.env.GITHUB_OUTPUT, "build=" + (selection.mode === "source") + "\n");'

  engine:
    name: Engine
    needs: [changes, engine-plan]
    if: needs.engine-plan.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/engine.yml
    with:
      integration: false
      tests: ${{ needs.changes.outputs.native == 'true' }}
      suites: ${{ needs.changes.outputs.native == 'true' }}

  host-plan:
    name: Select VST3 host
    needs: changes
    if: needs.changes.outputs.host == 'true' || needs.changes.outputs.orbit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: select
        env:
          HOST_AFFECTED: ${{ needs.changes.outputs.host }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { selectHost } from "./hosts/vst3-host/src/prepare.ts";
            const selection = process.env.HOST_AFFECTED === "true"
              ? { mode: "source", reason: "host package affected" }
              : await selectHost();
            console.log(selection);
            appendFileSync(process.env.GITHUB_OUTPUT, "build=" + (selection.mode === "source") + "\n");'

  workspace:
    name: Workspace
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Native formatting uses the installed Clang 18 toolchain.
      CC: clang
      CXX: clang++
      # Without it CMake defaults to Makefiles, which build one file at a time;
      # the native-deps action installs Ninja.
      CMAKE_GENERATOR: Ninja
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Native input detection regression tests
        run: node --test .github/scripts/windows-plugin-check.test.mjs .github/scripts/native-changes.test.mjs .github/scripts/verify-results.test.mjs

      - name: Engine prebuilt release tooling tests
        run: node --test .github/scripts/engine-prebuilts.test.mjs

      - name: Run formatter
        run: pnpm run format

      - name: Run linter
        run: pnpm run lint:check

      - name: Run build
        run: pnpm run build

      - name: Run test
        run: pnpm turbo run test --filter=!./examples/* --filter=!@soundor/react-tests

      - name: Example application tests, types and web builds
        run: |
          pnpm --filter basic --filter primitives --filter orbit test &&
          pnpm --filter orbit test:native &&
          pnpm --filter basic --filter primitives --filter orbit typecheck &&
          pnpm --filter basic --filter primitives --filter orbit build:web

      # The docs and the examples' web builds they embed; fails on a broken
      # internal link or anchor. Deployed by website.yml.
      - name: Website build
        run: pnpm turbo run build --filter=website

      - name: Packed Vitest consumer smoke
        run: pnpm --filter @soundor/vitest test:consumer

      - name: Install DevTools browser
        run: pnpm --filter @soundor/devtools-client exec playwright install --with-deps chromium

      - name: DevTools browser E2E
        run: pnpm --filter @soundor/devtools-client test:e2e

      # The built site in Chromium (installed above, same Playwright): pages,
      # search, an embedded example, and editing its code.
      - name: Website browser tests
        run: pnpm --filter website test:e2e

      - name: Packed DevTools consumer smoke
        run: pnpm --filter soundor test:devtools-consumer

      - name: Animation benchmark driver tests
        run: pnpm --filter soundor-benchmark test

  juce8:
    name: JUCE 8 (juce-runtime)
    needs: [changes, engine-plan, engine]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.juce == 'true' && needs.engine-plan.result == 'success' &&
      (needs.engine-plan.outputs.build != 'true' || needs.engine.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/juce.yml
    with:
      juce: 2cdfca8feb300fb424002ba2c2751569e5bacb64 # 8.0.14
      # An author on Visual Studio 2022, as the JUCE 9 group is one on 2026.
      msvc-toolset: v143,version=14.44
      build-engine: ${{ needs.engine-plan.outputs.build == 'true' }}

  # JUCE 9 compiles its image libraries with plain C names, as Skia's (renamed)
  # copies.
  juce9:
    name: JUCE 9 (juce-runtime)
    needs: [changes, engine-plan, engine]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.juce == 'true' && needs.engine-plan.result == 'success' &&
      (needs.engine-plan.outputs.build != 'true' || needs.engine.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/juce.yml
    with:
      juce: 3fb5cbc0340758596dac39f7c8de47d562b4896e # 9.0.4
      build-engine: ${{ needs.engine-plan.outputs.build == 'true' }}

  benchmark:
    name: Benchmark smoke
    needs: changes
    if: needs.changes.outputs.benchmark == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup native dependencies
        id: deps
        uses: ./.github/actions/native-deps
        with:
          job: verify

      # Work per frame (read-backs, native calls, idle ticks), never FPS: on
      # lavapipe, a few frames of each animation scenario.
      - name: Animation benchmark smoke
        run: |
          pnpm --filter soundor-benchmark bench --only animation --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/animation.json"
          pnpm --filter soundor-benchmark bench --only animation --animations native --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/native-animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/native-animation.json"
          pnpm --filter soundor-benchmark bench --only advanced-animation --animations native --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/advanced-animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/advanced-animation.json"

      - name: Native React SVG rendering
        run: |
          pnpm --filter soundor-benchmark exec playwright install --with-deps chromium
          pnpm --filter soundor-benchmark test:svg-native
          pnpm --filter soundor-benchmark bench --only svg --script-scale --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/svg.json"
          node tools/benchmark/scripts/verify-svg-report.mjs "$RUNNER_TEMP/svg.json"

      - name: Save native dependencies
        if: always() && steps.deps.outputs.cache-key != ''
        uses: ./.github/actions/native-deps-save
        with:
          key: ${{ steps.deps.outputs.cache-key }}
          restored: ${{ steps.deps.outputs.cache-matched-key }}

  # @soundor/vst3-host: its executable on every target, tested headless and
  # with its editor, for the jobs that use it. Clang-tidy and sanitizers only
  # when the host itself is affected. Nothing of the engine.
  host:
    name: VST3 (host)
    needs: [changes, host-plan]
    if: needs.host-plan.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vst3-host-artifacts.yml
    with:
      checks: ${{ needs.changes.outputs.host == 'true' }}

  orbit:
    name: Orbit E2E
    needs: [changes, engine-plan, engine, host-plan, host]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.orbit == 'true' && needs.engine-plan.result == 'success' &&
      (needs.engine-plan.outputs.build != 'true' || needs.engine.result == 'success') &&
      needs.host-plan.result == 'success' &&
      (needs.host-plan.outputs.build != 'true' || needs.host.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/orbit.yml
    with:
      build-engine: ${{ needs.engine-plan.outputs.build == 'true' }}
      build-host: ${{ needs.host-plan.outputs.build == 'true' }}

  verify:
    name: Verify
    if: always()
    needs:
      [
        changes,
        workspace,
        engine-plan,
        engine,
        benchmark,
        juce8,
        juce9,
        host-plan,
        host,
        orbit,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all applicable checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/verify-results.mjs
