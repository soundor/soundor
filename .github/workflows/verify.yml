name: Verify

on:
  workflow_call:
    outputs:
      host:
        description: Whether this run built and tested the VST3 host's artifacts
        value: ${{ jobs.host-plan.outputs.build }}
  pull_request:
    # Each layer of the SVG stack must be verified against its own base.
    branches: [main, feat/svg-skia, feat/svg-image, feat/svg-scene]

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Native input detection
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      native: ${{ steps.detect.outputs.native }}
      juce: ${{ steps.detect.outputs.juce }}
      benchmark: ${{ steps.detect.outputs.benchmark }}
      host: ${{ steps.detect.outputs.host }}
      orbit: ${{ steps.detect.outputs.orbit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/native-changes.mjs

  engine-plan:
    name: Select engine
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' || needs.changes.outputs.juce == 'true' ||
      needs.changes.outputs.orbit == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/soundor-cache/engine-manifests
          key: engine-manifests-${{ hashFiles('runtimes/engine/package.json') }}
      - id: select
        env:
          ENGINE_AFFECTED: ${{ needs.changes.outputs.native }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { selectEngine } from "./runtimes/engine/scripts/engine-selection.mjs";
            const selection = process.env.ENGINE_AFFECTED === "true"
              ? { mode: "source", reason: "engine package affected" }
              : await selectEngine("runtimes/engine", process.env.RUNNER_TEMP + "/soundor-cache");
            console.log(selection);
            appendFileSync(process.env.GITHUB_OUTPUT, "build=" + (selection.mode === "source") + "\n");'

  engine-artifacts:
    name: Engine artifacts
    needs: [changes, engine-plan]
    if: needs.engine-plan.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/engine-artifacts.yml
    with:
      integration: false
      tests: ${{ needs.changes.outputs.native == 'true' }}

  host-plan:
    name: Select VST3 host
    needs: changes
    if: needs.changes.outputs.host == 'true' || needs.changes.outputs.orbit == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: select
        env:
          HOST_AFFECTED: ${{ needs.changes.outputs.host }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { selectHost } from "./hosts/vst3-host/src/prepare.ts";
            const selection = process.env.HOST_AFFECTED === "true"
              ? { mode: "source", reason: "host package affected" }
              : await selectHost();
            console.log(selection);
            appendFileSync(process.env.GITHUB_OUTPUT, "build=" + (selection.mode === "source") + "\n");'

  fast:
    name: Fast checks
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Native formatting uses the installed Clang 18 toolchain.
      CC: clang
      CXX: clang++
      # Without it CMake defaults to Makefiles, which build one file at a time;
      # the native-deps action installs Ninja.
      CMAKE_GENERATOR: Ninja
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Native input detection regression tests
        run: node --test .github/scripts/native-changes.test.mjs .github/scripts/verify-results.test.mjs

      - name: Engine prebuilt release tooling tests
        run: node --test .github/scripts/engine-prebuilts.test.mjs

      # Each step keeps its output for "Report the failure".
      - name: Run formatter
        run: set -o pipefail; pnpm run format 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Run linter
        run: set -o pipefail; pnpm run lint:check 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Run build
        run: set -o pipefail; pnpm run build 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Run test
        run: set -o pipefail; pnpm turbo run test --filter=!./examples/* --filter=!@soundor/react-tests 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Example application tests, types and web builds
        run: |
          set -o pipefail
          {
            pnpm --filter basic --filter primitives --filter orbit test &&
            pnpm --filter orbit test:native &&
            pnpm --filter basic --filter primitives --filter orbit typecheck &&
            pnpm --filter basic --filter primitives --filter orbit build:web
          } 2>&1 | tee "$RUNNER_TEMP/step.log"

      # The docs and the examples' web builds they embed; fails on a broken
      # internal link or anchor. Deployed by website.yml.
      - name: Website build
        run: set -o pipefail; pnpm turbo run build --filter=website 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Packed Vitest consumer smoke
        run: set -o pipefail; pnpm --filter @soundor/vitest test:consumer 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Install DevTools browser
        run: set -o pipefail; pnpm --filter @soundor/devtools-client exec playwright install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: DevTools browser E2E
        run: set -o pipefail; pnpm --filter @soundor/devtools-client test:e2e 2>&1 | tee "$RUNNER_TEMP/step.log"

      # The built site in Chromium (installed above, same Playwright): pages,
      # search, an embedded example, and editing its code.
      - name: Website browser tests
        run: set -o pipefail; pnpm --filter website test:e2e 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Packed DevTools consumer smoke
        run: set -o pipefail; pnpm --filter soundor test:devtools-consumer 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Animation benchmark driver tests
        run: pnpm --filter soundor-benchmark test

      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          { grep -iE "error|FAILED" "$RUNNER_TEMP/step.log" | head -n 30; echo ...; tail -n 30 "$RUNNER_TEMP/step.log"; } | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > "$RUNNER_TEMP/tail.txt"
          echo "::error title=${{ github.job }} failed::$(cat "$RUNNER_TEMP/tail.txt")"

  engine:
    name: Native (linux-clang)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja
      SOUNDOR_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup native dependencies
        id: deps
        uses: ./.github/actions/native-deps
        with:
          job: verify

      - name: Build workspace
        run: pnpm turbo run build --filter=@soundor/engine...
      # clang-tidy's passes (runtimes/engine/cmake/SoundorClangTidyCache.mjs):
      # a translation unit whose source, headers and configuration are as
      # main last saw them is not analyzed again. Saved only on main.
      - name: Restore clang-tidy results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clang-tidy
          key: clang-tidy-${{ github.sha }}
          restore-keys: clang-tidy-
      - name: Native static analysis
        env:
          SOUNDOR_CLANG_TIDY_CACHE: ${{ runner.temp }}/clang-tidy
        run: pnpm turbo run lint:native
      - name: Save clang-tidy results
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clang-tidy
          key: clang-tidy-${{ github.sha }}

      # The tests of the build clang-tidy just made (the dev preset plus
      # clang-tidy), not a second build of the same sources.
      - name: Native runtime tests
        working-directory: runtimes/engine
        run: ctest --preset tidy

      # A failed step's errors and the end of its output as an annotation: shown on the PR's
      # checks, and readable through the API without downloading the log.
      - name: Save native dependencies
        if: always() && steps.deps.outputs.cache-key != ''
        uses: ./.github/actions/native-deps-save
        with:
          key: ${{ steps.deps.outputs.cache-key }}
          restored: ${{ steps.deps.outputs.cache-matched-key }}

  benchmark:
    name: Benchmark smoke
    needs: changes
    if: needs.changes.outputs.benchmark == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup native dependencies
        id: deps
        uses: ./.github/actions/native-deps
        with:
          job: verify

      # Work per frame (read-backs, native calls, idle ticks), never FPS: on
      # lavapipe, a few frames of each animation scenario.
      - name: Animation benchmark smoke
        run: |
          pnpm --filter soundor-benchmark bench --only animation --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/animation.json"
          pnpm --filter soundor-benchmark bench --only animation --animations native --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/native-animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/native-animation.json"
          pnpm --filter soundor-benchmark bench --only advanced-animation --animations native --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/advanced-animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/advanced-animation.json"

      - name: Native React SVG rendering
        run: |
          pnpm --filter soundor-benchmark exec playwright install --with-deps chromium
          pnpm --filter soundor-benchmark test:svg-native
          pnpm --filter soundor-benchmark bench --only svg --script-scale --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/svg.json"
          node tools/benchmark/scripts/verify-svg-report.mjs "$RUNNER_TEMP/svg.json"

      - name: Save native dependencies
        if: always() && steps.deps.outputs.cache-key != ''
        uses: ./.github/actions/native-deps-save
        with:
          key: ${{ steps.deps.outputs.cache-key }}
          restored: ${{ steps.deps.outputs.cache-matched-key }}

  native:
    name: Native (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            preset: dev
            cc: gcc
            cxx: g++
          - name: linux-sanitizers
            os: ubuntu-24.04
            preset: sanitize
            cc: clang
            cxx: clang++
          # Without ANGLE, as on iOS: canvases have no WebGL, and nothing
          # else may depend on the GPU.
          - name: linux-nogpu
            os: ubuntu-24.04
            preset: nogpu
            cc: clang
            cxx: clang++
            require-gpu: '0'
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # GPU tests need a device (lavapipe on Linux, WARP on Windows, Metal on
      # macOS); without one they fail, not skip. Not in the build without one.
      SOUNDOR_REQUIRE_GPU: ${{ matrix.require-gpu || '1' }}
    defaults:
      run:
        working-directory: runtimes/engine
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and the workspace's packages: the build lowers the runtime's
      # JavaScript modules (and the tests' Three.js) with @soundor/core.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup native dependencies
        id: deps
        uses: ./.github/actions/native-deps
        with:
          job: ${{ matrix.name }}

      # Ninja, as local and plugin builds use on macOS and Linux (CMake's
      # default there is Makefiles). Windows keeps Visual Studio, which finds
      # MSVC without a developer environment, as plugin builds do.
      - name: Use Ninja
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Build and test the native runtime
        timeout-minutes: 60
        shell: bash
        run: set -o pipefail; cmake --workflow --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/step.log"

      # A failed step's errors and the end of its output as an annotation: shown on the PR's
      # checks, and readable through the API without downloading the log.
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          { grep -iE "error|FAILED" "$RUNNER_TEMP/step.log" | head -n 30; echo ...; tail -n 30 "$RUNNER_TEMP/step.log"; } | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > "$RUNNER_TEMP/tail.txt"
          echo "::error title=${{ github.job }} failed::$(cat "$RUNNER_TEMP/tail.txt")"

      - name: Save native dependencies
        if: always() && steps.deps.outputs.cache-key != ''
        uses: ./.github/actions/native-deps-save
        with:
          key: ${{ steps.deps.outputs.cache-key }}
          restored: ${{ steps.deps.outputs.cache-matched-key }}

  juce:
    name: Native JUCE integration (${{ matrix.name }})
    needs: [changes, engine-plan, engine-artifacts]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.juce == 'true' && needs.engine-plan.result == 'success' &&
      (needs.engine-plan.outputs.build != 'true' || needs.engine-artifacts.result == 'success')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # JUCE 8 (8.0.14) and JUCE 9 (9.0.4), which compiles its image
        # libraries with plain C names, as Skia's (renamed) copies.
        include:
          - {
              name: linux,
              os: ubuntu-24.04,
              cc: clang,
              cxx: clang++,
              cache: verify,
              target: linux-x64,
              juce: 2cdfca8feb300fb424002ba2c2751569e5bacb64,
            }
          - {
              name: macos,
              os: macos-15,
              cc: clang,
              cxx: clang++,
              cache: macos,
              target: macos-universal,
              juce: 2cdfca8feb300fb424002ba2c2751569e5bacb64,
            }
          - {
              name: windows,
              os: windows-2025,
              cc: cl,
              cxx: cl,
              cache: windows,
              target: windows-x64,
              juce: 2cdfca8feb300fb424002ba2c2751569e5bacb64,
            }
          - {
              name: linux-juce9,
              os: ubuntu-24.04,
              cc: clang,
              cxx: clang++,
              cache: verify,
              target: linux-x64,
              juce: 3fb5cbc0340758596dac39f7c8de47d562b4896e,
            }
          - {
              name: macos-juce9,
              os: macos-15,
              cc: clang,
              cxx: clang++,
              cache: macos,
              target: macos-universal,
              juce: 3fb5cbc0340758596dac39f7c8de47d562b4896e,
            }
          - {
              name: windows-juce9,
              os: windows-2025,
              cc: cl,
              cxx: cl,
              cache: windows,
              target: windows-x64,
              juce: 3fb5cbc0340758596dac39f7c8de47d562b4896e,
            }
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Match the Clang 18 bitcode emitted by JUCE's Release LTO flags.
      LDFLAGS: ${{ startsWith(matrix.name, 'linux') && '-fuse-ld=lld-18' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup consumer dependencies
        uses: ./.github/actions/engine-consumer
      - name: Download this checkout's engine
        if: needs.engine-plan.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-prebuilt-${{ github.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/engine-artifacts
      - name: Select this checkout's engine artifacts
        if: needs.engine-plan.outputs.build == 'true'
        run: |
          node .github/scripts/engine-prebuilts.mjs local-manifest "$RUNNER_TEMP/engine-artifacts" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/engine-manifest.json"
          manifest=$(cygpath -m "$RUNNER_TEMP/engine-manifest.json" 2>/dev/null || echo "$RUNNER_TEMP/engine-manifest.json")
          echo "SOUNDOR_ENGINE_MANIFEST=$manifest" >> "$GITHUB_ENV"
      # CI-only checkout, outside either npm package; never distributed.
      - name: Checkout JUCE integration fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juce-framework/JUCE
          ref: ${{ matrix.juce }}
          path: .soundor/ci-juce
      - name: JUCE platform dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev xvfb
      - name: Use Ninja
        if: runner.os != 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - name: Build workspace
        run: pnpm turbo run build --filter=@soundor/juce-runtime... --filter=@soundor/devtools-client...
      - name: Build and test JUCE adapters
        run: |
          set -eo pipefail
          {
            cmake -S runtimes/juce-runtime/native -B .soundor/juce-tests -DCMAKE_BUILD_TYPE=Debug -DSOUNDOR_BUILD_TESTS=ON -DSOUNDOR_ENGINE_MODE=prebuilt -DSOUNDOR_ENABLE_DEVTOOLS=ON -DSOUNDOR_JUCE_TESTS=ON -DJUCE_DIR="$GITHUB_WORKSPACE/.soundor/ci-juce"
            cmake --build .soundor/juce-tests --target soundor_juce_tests soundor_juce_platform_tests soundor_debug_target --config Debug --parallel 3
            if [ "${{ runner.os }}" = "Linux" ]; then
              xvfb-run -a ctest --test-dir .soundor/juce-tests -C Debug -R 'soundor_juce_(tests|platform_tests)|soundor_debug_session' --output-on-failure
            else
              ctest --test-dir .soundor/juce-tests -C Debug -R 'soundor_juce_(tests|platform_tests)|soundor_debug_session' --output-on-failure
            fi
          } 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: Build the test plugin
        env:
          JUCE_DIR: ${{ github.workspace }}/.soundor/ci-juce
        run: set -o pipefail; pnpm --filter @soundor/juce-runtime test:plugin 2>&1 | tee "$RUNNER_TEMP/step.log"
      # The test plugin's editor, hosted and resized as a DAW does (EditorResize.cpp).
      - name: Resize the test plugin's editor
        if: runner.os == 'Linux'
        run: |
          set -eo pipefail
          {
            cmake --build .soundor/juce-tests --target soundor_juce_editor_resize --config Debug --parallel 3
            plugin="$(find "$GITHUB_WORKSPACE/runtimes/juce-runtime/tests/plugin/.soundor/dist/juce" -name '*.vst3' -type d | head -1)"
            cd "$RUNNER_TEMP"
            xvfb-run -a -s "-screen 0 1920x1200x24" "$GITHUB_WORKSPACE/.soundor/juce-tests/backend/juce/tests/soundor_juce_editor_resize_artefacts/Debug/soundor_juce_editor_resize" "$plugin"
          } 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: Report JUCE integration failure
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'step.log'
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              errors = [line for line in lines if any(word in line.lower() for word in ['error', 'failed', 'undefined'])]
              report = '\n'.join(errors[:30] + lines[-35:])[-7000:]
              for start in range(0, len(report), 2500):
                  chunk = report[start:start + 2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=JUCE integration failure::{chunk}')
          PYTHON

  # @soundor/vst3-host: its executable on every target, tested headless and
  # with its editor, for the jobs that use it. Clang-tidy and sanitizers only
  # when the host itself is affected. Nothing of the engine.
  host:
    name: VST3 host
    needs: [changes, host-plan]
    if: needs.host-plan.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vst3-host-artifacts.yml
    with:
      checks: ${{ needs.changes.outputs.host == 'true' }}

  # Orbit's end-to-end tests: its Debug VST3 in the real VST3 host, UI and audio,
  # on every platform. Only the tests' reports are kept, never the built plugin.
  orbit:
    name: Orbit e2e (${{ matrix.name }})
    needs: [changes, engine-plan, engine-artifacts, host-plan, host]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.orbit == 'true' && needs.engine-plan.result == 'success' &&
      (needs.engine-plan.outputs.build != 'true' || needs.engine-artifacts.result == 'success') &&
      needs.host-plan.result == 'success' &&
      (needs.host-plan.outputs.build != 'true' || needs.host.result == 'success')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: linux,
              os: ubuntu-24.04,
              cc: clang,
              cxx: clang++,
              target: linux-x64,
              host-target: linux-x64-gnu,
            }
          - {
              name: macos,
              os: macos-15,
              cc: clang,
              cxx: clang++,
              target: macos-universal,
              host-target: darwin-universal,
            }
          - {
              name: windows,
              os: windows-2025,
              cc: cl,
              cxx: cl,
              target: windows-x64,
              host-target: win32-x64,
            }
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Match the Clang 18 bitcode emitted by JUCE's flags.
      LDFLAGS: ${{ matrix.name == 'linux' && '-fuse-ld=lld-18' || '' }}
      JUCE_DIR: ${{ github.workspace }}/.soundor/ci-juce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup consumer dependencies
        uses: ./.github/actions/engine-consumer
      - name: Download this checkout's engine
        if: needs.engine-plan.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-prebuilt-${{ github.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/engine-artifacts
      - name: Select this checkout's engine artifacts
        if: needs.engine-plan.outputs.build == 'true'
        run: |
          node .github/scripts/engine-prebuilts.mjs local-manifest "$RUNNER_TEMP/engine-artifacts" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/engine-manifest.json"
          manifest=$(cygpath -m "$RUNNER_TEMP/engine-manifest.json" 2>/dev/null || echo "$RUNNER_TEMP/engine-manifest.json")
          echo "SOUNDOR_ENGINE_MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Download this checkout's VST3 host
        if: needs.host-plan.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vst3-host-${{ github.sha }}-${{ matrix.host-target }}
          path: ${{ runner.temp }}/vst3-host
      - name: Select this checkout's VST3 host
        if: needs.host-plan.outputs.build == 'true'
        run: |
          artifact=$(cygpath -m "$RUNNER_TEMP/vst3-host" 2>/dev/null || echo "$RUNNER_TEMP/vst3-host")
          echo "SOUNDOR_VST3_HOST_ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Select the VST3 host
        run: set -o pipefail; node hosts/vst3-host/src/cli.ts prepare --mode published 2>&1 | tee "$RUNNER_TEMP/step.log"
      # CI-only checkout, outside either npm package; never distributed.
      - name: Checkout JUCE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juce-framework/JUCE
          ref: 2cdfca8feb300fb424002ba2c2751569e5bacb64
          path: .soundor/ci-juce
      - name: Platform dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev libxtst-dev libxcomposite-dev libxdamage-dev libxfixes-dev libgl-dev libgl1-mesa-dev xvfb
      - name: Use Ninja
        if: runner.os != 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - name: Build workspace
        run: pnpm turbo run build --filter=orbit^...
      # Linux has no display here; the macOS and Windows runners have a desktop.
      - name: Test
        run: |
          set -o pipefail
          if [ "${{ runner.os }}" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1200x24" pnpm --filter orbit test:e2e
          else
            pnpm --filter orbit test:e2e
          fi 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: Keep the failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbit-e2e-results-${{ matrix.name }}
          path: examples/orbit/.soundor/test-results
          # .soundor is hidden.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Report the failure
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/step.log" ] || exit 0
          { grep -iE "error|FAIL" "$RUNNER_TEMP/step.log" | head -n 30 || true; echo ...; tail -n 30 "$RUNNER_TEMP/step.log"; } | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > "$RUNNER_TEMP/tail.txt"
          echo "::error title=Orbit e2e (${{ matrix.name }}) failed::$(cat "$RUNNER_TEMP/tail.txt")"

  verify:
    name: Verify
    if: always()
    needs:
      [
        changes,
        fast,
        engine-plan,
        engine-artifacts,
        engine,
        benchmark,
        native,
        juce,
        host-plan,
        host,
        orbit,
      ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all applicable checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/verify-results.mjs
