name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Native input detection
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      native: ${{ steps.detect.outputs.native }}
      juce: ${{ steps.detect.outputs.juce }}
      benchmark: ${{ steps.detect.outputs.benchmark }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/native-changes.mjs

  fast:
    name: Fast checks
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Native formatting uses the installed Clang 18 toolchain.
      CC: clang
      CXX: clang++
      # Without it CMake defaults to Makefiles, which build one file at a time;
      # the native-deps action installs Ninja.
      CMAKE_GENERATOR: Ninja
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Native input detection regression tests
        run: node --test .github/scripts/native-changes.test.mjs

      - name: Engine prebuilt release tooling tests
        run: node --test .github/scripts/engine-prebuilts.test.mjs

      # Each step keeps its output for "Report the failure".
      - name: Run formatter
        run: set -o pipefail; pnpm run format 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Run linter
        run: set -o pipefail; pnpm run lint:check 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Run build
        run: set -o pipefail; pnpm run build 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Run test
        run: set -o pipefail; pnpm turbo run test --filter=!./examples/* --filter=!@soundor/react-tests 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Example application tests, types and web builds
        run: |
          set -o pipefail
          {
            pnpm --filter basic --filter primitives --filter orbit test &&
            pnpm --filter orbit test:native &&
            pnpm --filter basic --filter primitives --filter orbit typecheck &&
            pnpm --filter basic --filter primitives --filter orbit build:web
          } 2>&1 | tee "$RUNNER_TEMP/step.log"

      # The docs and the examples' web builds they embed; fails on a broken
      # internal link or anchor. Deployed by website.yml.
      - name: Website build
        run: set -o pipefail; pnpm turbo run build --filter=website 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Packed Vitest consumer smoke
        run: set -o pipefail; pnpm --filter @soundor/vitest test:consumer 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Install DevTools browser
        run: set -o pipefail; pnpm --filter @soundor/devtools-client exec playwright install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: DevTools browser E2E
        run: set -o pipefail; pnpm --filter @soundor/devtools-client test:e2e 2>&1 | tee "$RUNNER_TEMP/step.log"

      # The built site in Chromium (installed above, same Playwright): pages,
      # search, an embedded example, and editing its code.
      - name: Website browser tests
        run: set -o pipefail; pnpm --filter website test:e2e 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Packed DevTools consumer smoke
        run: set -o pipefail; pnpm --filter soundor test:devtools-consumer 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Animation benchmark driver tests
        run: pnpm --filter soundor-benchmark test

      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          { grep -iE "error|FAILED" "$RUNNER_TEMP/step.log" | head -n 30; echo ...; tail -n 30 "$RUNNER_TEMP/step.log"; } | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > "$RUNNER_TEMP/tail.txt"
          echo "::error title=${{ github.job }} failed::$(cat "$RUNNER_TEMP/tail.txt")"

  engine:
    name: Native (linux-clang)
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja
      SOUNDOR_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        if: needs.changes.outputs.native == 'true'
        uses: ./.github/actions/setup
      - name: Setup native dependencies
        if: needs.changes.outputs.native == 'true'
        id: deps
        uses: ./.github/actions/native-deps
        with:
          job: verify

      - name: Build workspace
        if: needs.changes.outputs.native == 'true'
        run: pnpm build
      # clang-tidy's passes (runtimes/engine/cmake/SoundorClangTidyCache.mjs):
      # a translation unit whose source, headers and configuration are as
      # main last saw them is not analyzed again. Saved only on main.
      - name: Restore clang-tidy results
        if: needs.changes.outputs.native == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clang-tidy
          key: clang-tidy-${{ github.sha }}
          restore-keys: clang-tidy-
      - name: Native static analysis
        if: needs.changes.outputs.native == 'true'
        env:
          SOUNDOR_CLANG_TIDY_CACHE: ${{ runner.temp }}/clang-tidy
        run: pnpm turbo run lint:native
      - name: Save clang-tidy results
        if: needs.changes.outputs.native == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clang-tidy
          key: clang-tidy-${{ github.sha }}

      # The tests of the build clang-tidy just made (the dev preset plus
      # clang-tidy), not a second build of the same sources.
      - name: Native runtime tests
        if: needs.changes.outputs.native == 'true'
        working-directory: runtimes/engine
        run: ctest --preset tidy

      # A failed step's errors and the end of its output as an annotation: shown on the PR's
      # checks, and readable through the API without downloading the log.
      - name: Save native dependencies
        if: always() && steps.deps.outputs.cache-key != ''
        uses: ./.github/actions/native-deps-save
        with:
          key: ${{ steps.deps.outputs.cache-key }}
          restored: ${{ steps.deps.outputs.cache-matched-key }}

  benchmark:
    name: Benchmark smoke
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        if: needs.changes.outputs.benchmark == 'true'
        uses: ./.github/actions/setup
      - name: Setup native dependencies
        if: needs.changes.outputs.benchmark == 'true'
        id: deps
        uses: ./.github/actions/native-deps
        with:
          job: verify

      # Work per frame (read-backs, native calls, idle ticks), never FPS: on
      # lavapipe, a few frames of each animation scenario.
      - name: Animation benchmark smoke
        if: needs.changes.outputs.benchmark == 'true'
        run: |
          pnpm --filter soundor-benchmark bench --only animation --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/animation.json"
          pnpm --filter soundor-benchmark bench --only animation --animations native --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/native-animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/native-animation.json"
          pnpm --filter soundor-benchmark bench --only advanced-animation --animations native --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/advanced-animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/advanced-animation.json"

      - name: Save native dependencies
        if: always() && steps.deps.outputs.cache-key != ''
        uses: ./.github/actions/native-deps-save
        with:
          key: ${{ steps.deps.outputs.cache-key }}
          restored: ${{ steps.deps.outputs.cache-matched-key }}

  native:
    name: Native (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            preset: dev
            cc: gcc
            cxx: g++
          - name: linux-sanitizers
            os: ubuntu-24.04
            preset: sanitize
            cc: clang
            cxx: clang++
          # Without ANGLE, as on iOS: canvases have no WebGL, and nothing
          # else may depend on the GPU.
          - name: linux-nogpu
            os: ubuntu-24.04
            preset: nogpu
            cc: clang
            cxx: clang++
            require-gpu: '0'
          - name: macos
            os: macos-15
            preset: dev
            cc: clang
            cxx: clang++
          - name: windows
            os: windows-2025
            preset: dev
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # GPU tests need a device (lavapipe on Linux, WARP on Windows, Metal on
      # macOS); without one they fail, not skip. Not in the build without one.
      SOUNDOR_REQUIRE_GPU: ${{ matrix.require-gpu || '1' }}
    defaults:
      run:
        working-directory: runtimes/engine
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and the workspace's packages: the build lowers the runtime's
      # JavaScript modules (and the tests' Three.js) with @soundor/core.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup native dependencies
        if: needs.changes.outputs.native == 'true'
        id: deps
        uses: ./.github/actions/native-deps
        with:
          job: ${{ matrix.name }}

      # Ninja, as local and plugin builds use on macOS and Linux (CMake's
      # default there is Makefiles). Windows keeps Visual Studio, which finds
      # MSVC without a developer environment, as plugin builds do.
      - name: Use Ninja
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Build and test the native runtime
        if: needs.changes.outputs.native == 'true'
        timeout-minutes: 60
        shell: bash
        run: set -o pipefail; cmake --workflow --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Diagnose Windows runtime crash
        timeout-minutes: 5
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $debugger = Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Filter cdb.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          $env:SOUNDOR_WINDOWS_CRASH_DIAGNOSTICS = '1'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'windows-crash.txt'
          if ($debugger) {
            & $debugger.FullName -c 'sxe av; sxe sov; g; .ecxr; kv; q' build/dev/tests/Debug/soundor_runtime_tests.exe '--test-case=does nothing until assistive technology asks*' '--no-breaks' 2>&1 | Tee-Object -FilePath $diagnostics
          } else {
            Write-Output 'Windows debugger unavailable; run the first JS runtime test in isolation.'
            & build/dev/tests/Debug/soundor_runtime_tests.exe '--test-case=creates and destroys an engine' '--no-breaks' 2>&1 | Tee-Object -FilePath $diagnostics
          }
          $details = (Get-Content $diagnostics -Tail 100) -join "`n"
          # Check annotation messages are truncated at 4096 characters.
          # Split before escaping so the exception stack is never cut off.
          for ($offset = 0; $offset -lt $details.Length; $offset += 2500) {
            $chunk = $details.Substring($offset, [Math]::Min(2500, $details.Length - $offset))
            $chunk = $chunk.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            $part = 1 + [Math]::Floor($offset / 2500)
            Write-Output "::error title=Windows runtime crash diagnostics part ${part}::$chunk"
          }

      # A failed step's errors and the end of its output as an annotation: shown on the PR's
      # checks, and readable through the API without downloading the log.
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          { grep -iE "error|FAILED" "$RUNNER_TEMP/step.log" | head -n 30; echo ...; tail -n 30 "$RUNNER_TEMP/step.log"; } | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > "$RUNNER_TEMP/tail.txt"
          echo "::error title=${{ github.job }} failed::$(cat "$RUNNER_TEMP/tail.txt")"

      - name: Save native dependencies
        if: always() && steps.deps.outputs.cache-key != ''
        uses: ./.github/actions/native-deps-save
        with:
          key: ${{ steps.deps.outputs.cache-key }}
          restored: ${{ steps.deps.outputs.cache-matched-key }}

  juce:
    name: Native JUCE integration (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: linux,
              os: ubuntu-24.04,
              cc: clang,
              cxx: clang++,
              cache: verify,
            }
          - { name: macos, os: macos-15, cc: clang, cxx: clang++, cache: macos }
          - { name: windows, os: windows-2025, cc: cl, cxx: cl, cache: windows }
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Match the Clang 18 bitcode emitted by JUCE's Release LTO flags.
      LDFLAGS: ${{ matrix.name == 'linux' && '-fuse-ld=lld-18' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        if: needs.changes.outputs.juce == 'true'
        uses: ./.github/actions/setup
      - name: Setup native dependencies
        if: needs.changes.outputs.juce == 'true'
        id: deps
        uses: ./.github/actions/native-deps
        with:
          job: ${{ matrix.cache }}
      # CI-only checkout, outside either npm package; never distributed.
      - name: Checkout JUCE integration fixture
        if: needs.changes.outputs.juce == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juce-framework/JUCE
          ref: 2cdfca8feb300fb424002ba2c2751569e5bacb64
          path: .soundor/ci-juce
      - name: JUCE platform dependencies
        if: needs.changes.outputs.juce == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev xvfb
      - name: Use Ninja
        if: needs.changes.outputs.juce == 'true' && runner.os != 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - name: Build workspace
        if: needs.changes.outputs.juce == 'true'
        run: pnpm build
      - name: Build and test JUCE adapters
        if: needs.changes.outputs.juce == 'true'
        run: |
          set -eo pipefail
          {
            cmake -S runtimes/juce-runtime/native -B .soundor/juce-tests -DCMAKE_BUILD_TYPE=Debug -DSOUNDOR_BUILD_TESTS=ON -DSOUNDOR_ENABLE_DEVTOOLS=ON -DSOUNDOR_JUCE_TESTS=ON -DJUCE_DIR="$GITHUB_WORKSPACE/.soundor/ci-juce"
            cmake --build .soundor/juce-tests --target soundor_juce_tests soundor_juce_platform_tests soundor_debug_target --config Debug --parallel 3
            if [ "${{ runner.os }}" = "Linux" ]; then
              xvfb-run -a ctest --test-dir .soundor/juce-tests -C Debug -R 'soundor_juce_(tests|platform_tests)|soundor_debug_session' --output-on-failure
            else
              ctest --test-dir .soundor/juce-tests -C Debug -R 'soundor_juce_(tests|platform_tests)|soundor_debug_session' --output-on-failure
            fi
          } 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: Build the test plugin
        if: needs.changes.outputs.juce == 'true'
        env:
          JUCE_DIR: ${{ github.workspace }}/.soundor/ci-juce
        run: set -o pipefail; pnpm --filter @soundor/juce-runtime test:plugin 2>&1 | tee "$RUNNER_TEMP/step.log"
      - name: Report JUCE integration failure
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'step.log'
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              errors = [line for line in lines if any(word in line.lower() for word in ['error', 'failed', 'undefined'])]
              report = '\n'.join(errors[:30] + lines[-35:])[-7000:]
              for start in range(0, len(report), 2500):
                  chunk = report[start:start + 2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=JUCE integration failure::{chunk}')
          PYTHON
      - name: Save native dependencies
        if: always() && steps.deps.outputs.cache-key != ''
        uses: ./.github/actions/native-deps-save
        with:
          key: ${{ steps.deps.outputs.cache-key }}
          restored: ${{ steps.deps.outputs.cache-matched-key }}

  verify:
    name: Verify
    if: always()
    needs: [changes, fast, engine, benchmark, native, juce]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*) echo "Verification did not complete successfully: $RESULTS"; exit 1 ;;
            *) echo "All applicable verification passed" ;;
          esac
