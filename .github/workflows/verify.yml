name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Native input detection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      native: ${{ steps.detect.outputs.native }}
      benchmark: ${{ steps.detect.outputs.benchmark }}
      host: ${{ steps.detect.outputs.host }}
      e2e: ${{ steps.detect.outputs.e2e }}
      vst3: ${{ steps.detect.outputs.vst3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/native-changes.mjs

  engine-plan:
    name: Select engine
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' || needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.vst3 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.select.outputs.build }}
      artifact-run: ${{ steps.select.outputs.artifact-run }}
      artifact-commit: ${{ steps.select.outputs.artifact-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/soundor-cache/engine-manifests
          key: engine-manifests-${{ hashFiles('engine/package.json') }}
      - id: select
        env:
          NATIVE_AFFECTED: ${{ needs.changes.outputs.native }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/native-plan.mjs engine
      # Indexed before building, but lookup accepts only finished main runs
      # whose build jobs all passed and that still contain every binary artifact.
      - name: Index main's engine build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.select.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.select.outputs.artifact-key }}
          path: ${{ runner.temp }}/native-engine-index
          if-no-files-found: error
          retention-days: 7

  engine:
    name: Engine
    needs: [changes, engine-plan]
    if: needs.engine-plan.outputs.build == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/engine.yml
    with:
      release-build: false
      tests: ${{ needs.changes.outputs.native == 'true' }}
      suites: ${{ needs.changes.outputs.native == 'true' }}

  host-plan:
    name: Select VST3 host
    needs: changes
    if: >-
      needs.changes.outputs.host == 'true' || needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.vst3 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.select.outputs.build }}
      artifact-run: ${{ steps.select.outputs.artifact-run }}
      artifact-commit: ${{ steps.select.outputs.artifact-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: select
        env:
          NATIVE_AFFECTED: ${{ needs.changes.outputs.host }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/native-plan.mjs host
      # Indexed before building, but lookup accepts only finished main runs
      # whose build jobs all passed and that still contain every binary artifact.
      - name: Index main's host build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.select.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.select.outputs.artifact-key }}
          path: ${{ runner.temp }}/native-host-index
          if-no-files-found: error
          retention-days: 7

  workspace:
    name: Workspace
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Native formatting uses the installed Clang 18 toolchain.
      CC: clang
      CXX: clang++
      # Without it CMake defaults to Makefiles, which build one file at a time;
      # the native-deps action installs Ninja.
      CMAKE_GENERATOR: Ninja
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # The Web runtime compiles a plugin's lib/ to WebAssembly: its tests,
      # and the examples' web builds, need Rust's target for it.
      - name: Rust for WebAssembly
        run: rustup target add wasm32-unknown-unknown

      # The engine's WebAssembly core, which the web runtime lays out with:
      # engine({ target: 'web' }) uses the published module when the core's
      # sources match it, and builds them (with this) when a change or an
      # unpublished version makes them differ.
      - name: Setup Emscripten
        uses: ./.github/actions/emsdk

      - name: Native input detection regression tests
        run: node --test .github/scripts/windows-plugin-check.test.mjs .github/scripts/native-changes.test.mjs .github/scripts/verify-results.test.mjs

      - name: Prebuilt release tooling tests (engine, VST3 adapters)
        run: node --test .github/scripts/engine-prebuilts.test.mjs .github/scripts/vst3-adapters.test.mjs .github/scripts/native-artifacts.test.mjs .github/scripts/verified-deps.test.mjs .github/scripts/native-deps-release.test.mjs
      - name: Verified dependency archive tests
        run: python3 -m unittest discover -s .github/scripts -p 'verified_deps_test.py'

      - name: Storage cleanup policy tests
        run: node --test .github/scripts/cleanup-storage.test.mjs

      - name: Run formatter
        run: pnpm run format

      - name: Run linter
        run: pnpm run lint:check

      - name: Run build
        run: pnpm run build

      - name: Run test
        run: pnpm turbo run test --filter=!./examples/* --filter=!@soundor/react-tests

      # The Rust SDK the CLI ships: its lifecycle and C ABI tests, its lints.
      - name: Rust SDK tests
        run: |
          cargo fmt --check --manifest-path packages/cli/rust/soundor/Cargo.toml &&
          cargo clippy --all-targets --manifest-path packages/cli/rust/soundor/Cargo.toml -- -D warnings &&
          pnpm --filter soundor test:rust

      - name: Example application tests, types and web builds
        run: |
          pnpm --filter basic --filter primitives --filter analyzer --filter controller --filter midi --filter midi-arpeggiator test &&
          pnpm --filter basic --filter primitives --filter analyzer --filter controller --filter midi --filter midi-arpeggiator --filter snippets --filter soundor-benchmark --filter soundor-e2e test:rust &&
          pnpm --filter basic --filter primitives --filter analyzer --filter controller --filter midi --filter midi-arpeggiator --filter soundor-e2e typecheck &&
          pnpm --filter basic --filter primitives --filter analyzer --filter midi --filter midi-arpeggiator build:web

      # The docs and the examples' web builds they embed; fails on a broken
      # internal link or anchor. Deployed by website.yml.
      - name: Website build
        run: pnpm turbo run build --filter=website

      - name: Packed Vitest consumer smoke
        run: pnpm --filter @soundor/vitest test:consumer

      # Shared Chromium for the packed runtime smoke and browser E2E suites.
      - name: Install test browser
        run: pnpm --filter @soundor/devtools-client exec playwright install --with-deps chromium

      - name: Packed runtimes consumer smoke
        run: pnpm --filter soundor test:runtime-consumer

      - name: DevTools browser E2E
        run: pnpm --filter @soundor/devtools-client test:e2e

      # The Rust processor in Chromium's AudioWorklet (the browser installed
      # above, same Playwright), rendered offline and compared sample for sample.
      - name: Web runtime AudioWorklet tests
        run: pnpm --filter @soundor/web-runtime test:browser && pnpm --filter midi test:web

      # The built site in Chromium (installed above, same Playwright): pages,
      # search, an embedded example, and editing its code.
      - name: Website browser tests
        run: pnpm --filter website test:e2e

      # The end-to-end suite's plugin in the web runtime (Chromium, as
      # above): the engine's WebAssembly core and DOM adapter, the host's
      # audio inputs. Its VST3 suite is the E2E job's.
      - name: E2E browser tests
        run: pnpm --filter soundor-e2e test:web

      - name: Packed DevTools consumer smoke
        run: pnpm --filter soundor test:devtools-consumer

      - name: Animation benchmark driver tests
        run: pnpm --filter soundor-benchmark test

  benchmark:
    name: Benchmark smoke
    needs: changes
    if: needs.changes.outputs.benchmark == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      # The benchmark's web host lays out with the engine's WebAssembly core:
      # the published one, or built when the core's sources differ from it.
      - name: Setup Emscripten
        uses: ./.github/actions/emsdk
      - name: Setup native dependencies
        id: deps
        uses: ./.github/actions/native-deps
        with:
          job: verify

      # Work per frame (read-backs, native calls, idle ticks), never FPS: on
      # lavapipe, a few frames of each animation scenario.
      - name: Animation benchmark smoke
        run: |
          pnpm --filter soundor-benchmark bench --only animation --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/animation.json"
          pnpm --filter soundor-benchmark bench --only animation --animations native --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/native-animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/native-animation.json"
          pnpm --filter soundor-benchmark bench --only advanced-animation --animations native --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/advanced-animation.json"
          node tools/benchmark/scripts/verify-animation-report.ts "$RUNNER_TEMP/advanced-animation.json"

      - name: Native React SVG rendering
        run: |
          pnpm --filter soundor-benchmark exec playwright install --with-deps chromium
          pnpm --filter soundor-benchmark test:svg-native
          pnpm --filter soundor-benchmark bench --only svg --script-scale --runs 1 --frames 12 --warmup 3 --backend vulkan --software --out "$RUNNER_TEMP/svg.json"
          node tools/benchmark/scripts/verify-svg-report.mjs "$RUNNER_TEMP/svg.json"

      - name: Save native dependencies
        if: always() && steps.deps.outputs.cache-key != ''
        uses: ./.github/actions/native-deps-save
        with:
          key: ${{ steps.deps.outputs.cache-key }}
          restored: ${{ steps.deps.outputs.cache-matched-key }}
          offer: ${{ job.status == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # Skia, ANGLE and Hermes that this push's jobs built and no release has
  # yet, published once as an immutable release (native-deps-<recipes>-r<n>)
  # for every later job, on any branch, to fetch instead of building
  # (.github/scripts/native-deps-release.mjs). Each job offers only what it
  # built and only when it passed. Main only: pull requests never write one.
  native-deps-release:
    name: Release native dependencies
    needs: [engine, benchmark]
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.engine.result != 'skipped' || needs.benchmark.result != 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Two pushes never name the same revision.
    concurrency:
      group: native-deps-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Download the offered builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-deps-candidate-*
          path: ${{ runner.temp }}/native-deps-candidates
          merge-multiple: true
      - name: Keep what no release has
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/native-deps-release.mjs prepare "$RUNNER_TEMP/native-deps-candidates" "$RUNNER_TEMP/native-deps-release"
      # What fetch verifies before it reads an archive: built by this workflow on main.
      - name: Attest
        id: attest
        if: steps.prepare.outputs.count != '0'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/native-deps-release/*.tar.gz
      - name: Publish
        if: steps.prepare.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: node .github/scripts/native-deps-release.mjs publish "$RUNNER_TEMP/native-deps-release" "$TAG" "$BUNDLE"

  # @soundor/vst3-host: its executable on every target, tested headless and
  # with its editor, for the jobs that use it. Clang-tidy and sanitizers only
  # when the host itself is affected. Nothing of the engine.
  host:
    name: VST3 (host)
    needs: [changes, host-plan]
    if: needs.host-plan.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vst3-host-artifacts.yml
    with:
      checks: ${{ needs.changes.outputs.host == 'true' }}

  e2e:
    name: E2E
    needs: [changes, engine-plan, engine, host-plan, host]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.e2e == 'true' && needs.engine-plan.result == 'success' &&
      (needs.engine-plan.outputs.build != 'true' || needs.engine.result == 'success') &&
      needs.host-plan.result == 'success' &&
      (needs.host-plan.outputs.build != 'true' || needs.host.result == 'success')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/e2e.yml
    with:
      build-engine: ${{ needs.engine-plan.outputs.build == 'true' || needs.engine-plan.outputs.artifact-run != '' }}
      engine-run-id: ${{ needs.engine-plan.outputs.artifact-run }}
      engine-commit: ${{ needs.engine-plan.outputs.artifact-commit }}
      build-host: ${{ needs.host-plan.outputs.build == 'true' || needs.host-plan.outputs.artifact-run != '' }}
      host-run-id: ${{ needs.host-plan.outputs.artifact-run }}
      host-commit: ${{ needs.host-plan.outputs.artifact-commit }}

  # @soundor/vst3-runtime: its adapter built against the selected engine, its
  # test plugin and the controller example in the VST3 host and pluginval.
  vst3:
    name: VST3 (vst3-runtime)
    needs: [changes, engine-plan, engine, host-plan, host]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.vst3 == 'true' && needs.engine-plan.result == 'success' &&
      (needs.engine-plan.outputs.build != 'true' || needs.engine.result == 'success') &&
      needs.host-plan.result == 'success' &&
      (needs.host-plan.outputs.build != 'true' || needs.host.result == 'success')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/vst3.yml
    with:
      # The Windows adapter as Release builds it: plugins link it with this MSVC or newer.
      msvc-toolset: v143,version=14.44
      build-engine: ${{ needs.engine-plan.outputs.build == 'true' || needs.engine-plan.outputs.artifact-run != '' }}
      engine-run-id: ${{ needs.engine-plan.outputs.artifact-run }}
      engine-commit: ${{ needs.engine-plan.outputs.artifact-commit }}
      build-host: ${{ needs.host-plan.outputs.build == 'true' || needs.host-plan.outputs.artifact-run != '' }}
      host-run-id: ${{ needs.host-plan.outputs.artifact-run }}
      host-commit: ${{ needs.host-plan.outputs.artifact-commit }}

  verify:
    name: Verify
    if: always()
    needs:
      [
        changes,
        workspace,
        engine-plan,
        engine,
        benchmark,
        host-plan,
        host,
        e2e,
        vst3,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all applicable checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/verify-results.mjs
