name: Engine artifacts

# Read-only, shared by Verify and the release orchestrator. Builds and validates
# checkout artifacts; it has no release creation or publishing permissions.
on:
  workflow_call:
    inputs:
      integration:
        description: Run JUCE consumer checks here (Verify runs them downstream)
        type: boolean
        default: true
      tests:
        description: Run native tests against the packed engine
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      # Every target's result, even when one fails: nothing is released
      # unless all of them pass (the release job).
      fail-fast: false
      matrix:
        include:
          # cache: the native dependency cache to share with Verify's jobs
          # where the builds are the same.
          - {
              target: linux-x64,
              os: ubuntu-24.04,
              cc: clang,
              cxx: clang++,
              cache: linux-clang,
            }
          - {
              target: macos-universal,
              os: macos-15,
              cc: clang,
              cxx: clang++,
              cache: macos-universal,
            }
          - {
              target: windows-x64,
              os: windows-2025,
              cc: cl,
              cxx: cl,
              cache: windows,
            }
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      SOUNDOR_ENGINE_SOURCE_COMMIT: ${{ github.sha }}
      SOUNDOR_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup native dependencies
        id: deps
        uses: ./.github/actions/native-deps
        with:
          job: ${{ matrix.cache }}

      # The archives carry these notices (runtimes/engine/licenses).
      - name: AccessKit's crate notices match its Cargo.lock
        if: runner.os == 'Linux'
        run: node .github/scripts/accesskit-notices.mjs --check

      - name: Use Ninja
        if: runner.os != 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      # The DevTools session test serves the DevTools client.
      - name: Build workspace
        run: pnpm turbo run build --filter=@soundor/juce-runtime... --filter=@soundor/devtools-client...

      # Universal, with the oldest macOS it supports named.
      - name: Stage the engine
        working-directory: runtimes/engine
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ runner.os == 'macOS' && 'arm64;x86_64' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '12.0' || '' }}
        run: |
          cmake --workflow --preset prebuilt-debug && cmake --workflow --preset prebuilt-release

      # This private Skia suite cannot link against an imported archive. Keep
      # its platform coverage using the engine libraries we just built.
      - name: Private SVG tests against the source build
        if: inputs.tests
        working-directory: runtimes/engine
        run: |
          cmake --preset prebuilt-debug -DSOUNDOR_BUILD_TESTS=ON
          cmake --build build/prebuilt-debug --target soundor_svg_tests --config Debug --parallel 3
          ctest --test-dir build/prebuilt-debug -C Debug -R '^soundor_svg_tests$' --output-on-failure

      - name: Pack
        run: |
          for variant in debug release; do
            node .github/scripts/engine-prebuilts.mjs pack "runtimes/engine/build/prebuilt-$variant/stage" "$RUNNER_TEMP/prebuilts" \
              --commit "$GITHUB_SHA" --target ${{ matrix.target }}
          done

      # Everything below uses the archives as a consumer gets them: extracted
      # from the packed files, outside the build that made them.
      - name: Extract
        run: |
          version=$(node -p "require('./runtimes/engine/package.json').version")
          # Forward slashes on Windows too: these paths go to CMake.
          temp=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          for variant in debug release; do
            mkdir -p "$temp/extracted"
            cmake -E chdir "$temp/extracted" cmake -E tar xf "$temp/prebuilts/soundor-engine-$version-${{ matrix.target }}-$variant.tar.gz"
            echo "PREBUILT_$(echo $variant | tr a-z A-Z)=$temp/extracted/soundor-engine-$version-${{ matrix.target }}-$variant" >> "$GITHUB_ENV"
          done

      - name: Both architectures in every macOS library
        if: runner.os == 'macOS'
        run: |
          status=0
          for root in "$PREBUILT_DEBUG" "$PREBUILT_RELEASE"; do
            while IFS= read -r -d '' file; do
              archs=$(lipo -archs "$file" 2>&1)
              echo "$archs: ${file#"$root"/}"
              if ! echo " $archs " | grep -q ' arm64 ' || ! echo " $archs " | grep -q ' x86_64 '; then
                echo "error: ${file#"$root"/} is not universal ($archs)"
                status=1
              fi
            done < <(find "$root" \( -name '*.a' -o -path '*/bin/hermesc' \) -print0)
          done
          exit $status

      - name: Native tests against the debug engine
        if: inputs.tests
        working-directory: runtimes/engine
        run: SOUNDOR_ENGINE_PREBUILT_DIR="$PREBUILT_DEBUG" cmake --workflow --preset prebuilt-check-debug

      - name: Bytecode-only tests against the release engine
        if: inputs.tests
        working-directory: runtimes/engine
        run: SOUNDOR_ENGINE_PREBUILT_DIR="$PREBUILT_RELEASE" cmake --workflow --preset prebuilt-check-release

      # The universal archive links for the architecture this runner is not.
      - name: The x86_64 slice links
        if: runner.os == 'macOS'
        working-directory: runtimes/engine
        run: |
          cmake -S . -B build/prebuilt-check-x86_64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 \
              -DSOUNDOR_BUILD_TESTS=ON "-DSOUNDOR_ENGINE_PREBUILT_RELEASE_DIR=$PREBUILT_RELEASE" &&
            cmake --build build/prebuilt-check-x86_64 --target soundor_coexist_a soundor_coexist_b

      # CI-only checkout, outside either npm package; never distributed.
      - name: Checkout JUCE integration fixture
        if: inputs.integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juce-framework/JUCE
          ref: 2cdfca8feb300fb424002ba2c2751569e5bacb64
          path: .soundor/ci-juce
      # JUCE 9 compiles its image libraries with plain C names, as Skia's
      # (renamed) copies.
      - name: Checkout JUCE 9 integration fixture
        if: inputs.integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juce-framework/JUCE
          ref: 3fb5cbc0340758596dac39f7c8de47d562b4896e
          path: .soundor/ci-juce9
      - name: JUCE platform dependencies
        if: inputs.integration && runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev xvfb

      # The JUCE adapters and the DevTools bridge, linked to the debug engine.
      - name: JUCE adapters against the debug engine
        if: inputs.integration
        run: |
          cmake -S runtimes/juce-runtime/native -B .soundor/juce-prebuilt -DCMAKE_BUILD_TYPE=Debug -DSOUNDOR_BUILD_TESTS=ON \
            -DSOUNDOR_ENABLE_DEVTOOLS=ON -DSOUNDOR_JUCE_TESTS=ON -DJUCE_DIR="$GITHUB_WORKSPACE/.soundor/ci-juce" \
            "-DSOUNDOR_ENGINE_PREBUILT_DEBUG_DIR=$PREBUILT_DEBUG"
          cmake --build .soundor/juce-prebuilt --target soundor_juce_tests soundor_juce_platform_tests soundor_debug_target --config Debug --parallel 3
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a ctest --test-dir .soundor/juce-prebuilt -C Debug -R 'soundor_juce_(tests|platform_tests)|soundor_debug_session' --output-on-failure
          else
            ctest --test-dir .soundor/juce-prebuilt -C Debug -R 'soundor_juce_(tests|platform_tests)|soundor_debug_session' --output-on-failure
          fi

      # A plugin as a project builds it by default (juceRuntime's prebuilt
      # mode), from these archives: a manifest of them by file:// URL stands
      # in for the release the published package names.
      - name: A plugin with the prebuilt engine
        if: inputs.integration
        env:
          JUCE_DIR: ${{ github.workspace }}/.soundor/ci-juce
          # JUCE's Release LTO flags emit Clang 18 bitcode (as in juce.yml).
          LDFLAGS: ${{ runner.os == 'Linux' && '-fuse-ld=lld-18' || '' }}
        run: |
          set -eo pipefail
          {
            node .github/scripts/engine-prebuilts.mjs local-manifest "$RUNNER_TEMP/prebuilts" --out runtimes/engine/artifacts/manifest.json
            pnpm --filter @soundor/juce-runtime test:plugin-prebuilt
          } 2>&1 | tee "$RUNNER_TEMP/plugin.log"
          if grep -qE 'soundor_runtime\.dir|Building (Skia|ANGLE|Hermes)' "$RUNNER_TEMP/plugin.log"; then
            echo "::error::The plugin build compiled the engine instead of linking the prebuilt one"
            exit 1
          fi
          grep -q 'Soundor engine: the release prebuilt' "$RUNNER_TEMP/plugin.log"
          # The same plugin with JUCE 9, whose image libraries have plain C
          # names, as Skia's (renamed) copies.
          JUCE_DIR="$GITHUB_WORKSPACE/.soundor/ci-juce9" pnpm --filter @soundor/juce-runtime test:plugin-prebuilt 2>&1 |
            tee "$RUNNER_TEMP/plugin.log"
          rm runtimes/engine/artifacts/manifest.json

      - name: Keep the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-prebuilt-${{ github.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/prebuilts
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Save native dependencies
        if: always() && steps.deps.outputs.cache-key != ''
        uses: ./.github/actions/native-deps-save
        with:
          key: ${{ steps.deps.outputs.cache-key }}
          restored: ${{ steps.deps.outputs.cache-matched-key }}
