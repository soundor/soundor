name: Orbit

# Orbit's end-to-end tests: its Debug VST3 in the real VST3 host, UI and audio, on
# every platform, with the engine and the host Verify selected. Only the tests'
# reports are kept, never the built plugin.
on:
  workflow_call:
    inputs:
      build-engine:
        description: Use this run's engine artifacts rather than the released engine
        type: boolean
        required: true
      build-host:
        description: Use this run's VST3 host artifacts rather than the released host
        type: boolean
        required: true

permissions: {}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: linux,
              os: ubuntu-24.04,
              cc: clang,
              cxx: clang++,
              target: linux-x64,
              host-target: linux-x64-gnu,
            }
          - {
              name: macos,
              os: macos-15,
              cc: clang,
              cxx: clang++,
              target: macos-universal,
              host-target: darwin-universal,
            }
          - {
              name: windows,
              os: windows-2025,
              cc: cl,
              cxx: cl,
              target: windows-x64,
              host-target: win32-x64,
            }
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Match the Clang 18 bitcode emitted by JUCE's flags.
      LDFLAGS: ${{ matrix.name == 'linux' && '-fuse-ld=lld-18' || '' }}
      JUCE_DIR: ${{ github.workspace }}/.soundor/ci-juce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup consumer dependencies
        uses: ./.github/actions/engine-consumer
      - name: Download this checkout's engine
        if: inputs.build-engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Windows has separate artifacts for the dynamic and static C runtimes.
          pattern: engine-prebuilt-${{ github.sha }}-${{ matrix.target }}*
          merge-multiple: true
          path: ${{ runner.temp }}/engine-artifacts
      - name: Select this checkout's engine artifacts
        if: inputs.build-engine
        run: |
          node .github/scripts/engine-prebuilts.mjs local-manifest "$RUNNER_TEMP/engine-artifacts" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/engine-manifest.json"
          manifest=$(cygpath -m "$RUNNER_TEMP/engine-manifest.json" 2>/dev/null || echo "$RUNNER_TEMP/engine-manifest.json")
          echo "SOUNDOR_ENGINE_MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Download this checkout's VST3 host
        if: inputs.build-host
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vst3-host-${{ github.sha }}-${{ matrix.host-target }}
          path: ${{ runner.temp }}/vst3-host
      - name: Select this checkout's VST3 host
        if: inputs.build-host
        run: |
          artifact=$(cygpath -m "$RUNNER_TEMP/vst3-host" 2>/dev/null || echo "$RUNNER_TEMP/vst3-host")
          echo "SOUNDOR_VST3_HOST_ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Select the VST3 host
        run: node hosts/vst3-host/src/cli.ts prepare --mode published
      # CI-only checkout, outside either npm package; never distributed.
      - name: Checkout JUCE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juce-framework/JUCE
          ref: 2cdfca8feb300fb424002ba2c2751569e5bacb64
          path: .soundor/ci-juce
      - name: Platform dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev libxtst-dev libxcomposite-dev libxdamage-dev libxfixes-dev libgl-dev libgl1-mesa-dev xvfb
      - name: Use Ninja
        if: runner.os != 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - name: Build workspace
        run: pnpm turbo run build --filter=orbit^...
      # Linux has no display here; the macOS and Windows runners have a desktop.
      - name: Test
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1200x24" pnpm --filter orbit test:e2e
          else
            pnpm --filter orbit test:e2e
          fi
      - name: The plugin names the oldest macOS it supports
        if: runner.os == 'macOS'
        run: |
          plugin=$(find examples/orbit/.soundor/debug/juce -path '*.vst3/Contents/MacOS/*' -type f | head -1)
          [ -n "$plugin" ] || { echo "::error::No VST3 binary found"; exit 1; }
          .github/scripts/macos-minimum.sh 12.0 "$plugin"
      - name: Keep the failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbit-e2e-results-${{ matrix.name }}
          path: examples/orbit/.soundor/test-results
          # .soundor is hidden.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
