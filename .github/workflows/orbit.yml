name: Orbit

# Orbit's end-to-end tests: its Debug VST3 in the real VST3 host, UI and audio, on
# every platform, with the engine and the host Verify selected. Only the tests'
# reports are kept, never the built plugin.
on:
  workflow_call:
    inputs:
      build-engine:
        description: Use CI engine artifacts rather than the released engine
        type: boolean
        required: true
      engine-run-id:
        description: Successful main run to reuse (empty for this run)
        type: string
        default: ''
      engine-commit:
        description: Original source commit of the reused engine
        type: string
        default: ''
      build-host:
        description: Use CI VST3 host artifacts rather than the released host
        type: boolean
        required: true
      host-run-id:
        description: Successful main run to reuse (empty for this run)
        type: string
        default: ''
      host-commit:
        description: Original source commit of the reused host
        type: string
        default: ''

permissions: {}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: linux,
              os: ubuntu-24.04,
              target: linux-x64,
              host-target: linux-x64-gnu,
            }
          - {
              name: macos,
              os: macos-15,
              target: macos-universal,
              host-target: darwin-universal,
            }
          - {
              name: windows,
              os: windows-2025,
              target: windows-x64,
              host-target: win32-x64,
            }
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Rust SDK and WebAssembly target
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --check --manifest-path packages/cli/rust/soundor/Cargo.toml
          cargo clippy --all-targets --manifest-path packages/cli/rust/soundor/Cargo.toml -- -D warnings
          cargo test --manifest-path packages/cli/rust/soundor/Cargo.toml
      - name: Setup consumer dependencies
        uses: ./.github/actions/engine-consumer
      - name: Download this checkout's engine
        if: inputs.build-engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Windows has separate artifacts for the dynamic and static C runtimes.
          github-token: ${{ github.token }}
          run-id: ${{ inputs.engine-run-id || github.run_id }}
          pattern: engine-prebuilt-${{ inputs.engine-commit || github.sha }}-${{ matrix.target }}*
          merge-multiple: true
          path: ${{ runner.temp }}/engine-artifacts
      - name: Select this checkout's engine artifacts
        if: inputs.build-engine
        env:
          ENGINE_COMMIT: ${{ inputs.engine-commit || github.sha }}
        run: |
          node .github/scripts/engine-prebuilts.mjs local-manifest "$RUNNER_TEMP/engine-artifacts" --commit "$ENGINE_COMMIT" --out "$RUNNER_TEMP/engine-manifest.json"
          manifest=$(cygpath -m "$RUNNER_TEMP/engine-manifest.json" 2>/dev/null || echo "$RUNNER_TEMP/engine-manifest.json")
          echo "SOUNDOR_ENGINE_MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Download this checkout's VST3 host
        if: inputs.build-host
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.host-run-id || github.run_id }}
          name: vst3-host-${{ inputs.host-commit || github.sha }}-${{ matrix.host-target }}
          path: ${{ runner.temp }}/vst3-host
      - name: Select this checkout's VST3 host
        if: inputs.build-host
        run: |
          artifact=$(cygpath -m "$RUNNER_TEMP/vst3-host" 2>/dev/null || echo "$RUNNER_TEMP/vst3-host")
          echo "SOUNDOR_VST3_HOST_ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Select the VST3 host
        env:
          HOST_COMMIT: ${{ inputs.host-commit || github.sha }}
        run: node hosts/vst3-host/src/cli.ts prepare --mode published --commit "$HOST_COMMIT"
      # The adapter's X11 headers (types only: plugins load libX11 at run
      # time), and Xvfb for the editor.
      - name: Platform dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libx11-dev xvfb
      - name: Use Ninja
        if: runner.os != 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      # Linux builds with the installed Clang 18 and its linker, as vst3.yml.
      - name: Use Clang
        if: runner.os == 'Linux'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "LDFLAGS=-fuse-ld=lld-18" >> "$GITHUB_ENV"
      - name: Build workspace
        run: pnpm turbo run build --filter=orbit^...
      # The VST3 runtime's prebuilt adapter, which a workspace builds itself:
      # the Debug one, against the selected engine.
      - name: Build the VST3 adapter
        run: pnpm --filter @soundor/vst3-runtime build:native debug
      # Linux has no display here; the macOS and Windows runners have a desktop.
      - name: Test
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1200x24" pnpm --filter orbit test:e2e
          else
            pnpm --filter orbit test:e2e
          fi
      - name: The plugin names the oldest macOS it supports
        if: runner.os == 'macOS'
        run: |
          plugin=$(find examples/orbit/.soundor/dist/vst3 -path '*.vst3/Contents/MacOS/*' -type f | head -1)
          [ -n "$plugin" ] || { echo "::error::No VST3 binary found"; exit 1; }
          .github/scripts/macos-minimum.sh 12.0 "$plugin"
      - name: Keep the failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbit-e2e-results-${{ matrix.name }}
          path: examples/orbit/.soundor/test-results
          # .soundor is hidden.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
