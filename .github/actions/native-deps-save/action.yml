name: Save native dependencies
description: On a pull request, saves the Skia, ANGLE and Hermes builds of ./.github/actions/native-deps when the job completed any that the restored cache lacked; on main, saves the compiler cache and offers the builds no release has

inputs:
  key:
    description: native-deps's cache-key output (empty when the dependency cache is not used)
    required: false
    default: ''
  restored:
    description: native-deps's cache-matched-key output (empty when nothing was restored)
    required: false
    default: ''
  offer:
    description: Offer the complete builds no release has for Verify to publish (a successful job on main)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # A cache key cannot be overwritten, and a job may stop halfway (a failed
    # test, a dependency's server down). So the key names which builds are
    # complete: a job that completed more saves a new entry, which later jobs
    # restore (by prefix, the most recent first); one that completed nothing
    # new saves nothing.
    - name: Name the complete builds
      id: key
      if: inputs.key != ''
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        RESTORED: ${{ inputs.restored }}
      run: |
        node --input-type=module -e "
          import { createHash } from 'node:crypto';
          import { appendFileSync, existsSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          const root = process.env.SOUNDOR_CACHE;
          // What marks each build complete (SoundorSkia/Angle/Hermes.cmake).
          const complete = (name) =>
            ['defines.txt', 'libs.txt', 'release/hermes.txt', 'md/hermes.txt', 'mdd/hermes.txt', 'mt/hermes.txt', 'mtd/hermes.txt']
              .filter((marker) => existsSync(join(root, name, marker)))
              .map((marker) => name + '/' + marker);
          const builds = existsSync(root) ? readdirSync(root).sort().flatMap(complete) : [];
          const key = process.env.KEY + '-' + createHash('sha256').update(builds.join('\n')).digest('hex').slice(0, 16);
          const save = builds.length > 0 && key !== process.env.RESTORED;
          console.log((save ? 'Saving ' : 'Not saving ') + key + ':\n  ' + builds.join('\n  '));
          appendFileSync(process.env.GITHUB_OUTPUT, 'key=' + key + '\nsave=' + save + '\n');"

    - name: Save
      if: steps.key.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/soundor-cache
        key: ${{ steps.key.outputs.key }}

    - name: Save compiler cache
      if: env.SOUNDOR_CCACHE_KEY != '' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ env.SOUNDOR_CCACHE_KEY }}

    # For Verify's "Release native dependencies" job, which publishes them once
    # (.github/scripts/native-deps-release.mjs). Only from a job that passed:
    # a release is permanent.
    - name: Offer the builds no release has
      id: offer
      if: inputs.offer == 'true' && env.SOUNDOR_DEPENDENCY_GROUP != ''
      shell: bash
      run: node .github/scripts/native-deps-release.mjs offer "$RUNNER_TEMP/native-deps/offer"

    - name: Keep the offered builds
      if: steps.offer.outputs.count != '' && steps.offer.outputs.count != '0'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: native-deps-candidate-${{ github.job }}-${{ env.SOUNDOR_DEPENDENCY_GROUP }}
        path: ${{ runner.temp }}/native-deps/offer
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
