name: Setup Node.js and pnpm
description: Sets up Node.js, pnpm, and caches dependencies

inputs:
  cache:
    description: Whether to cache the pnpm store
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Ubuntu's mirror can stall on one package for minutes before apt gives up on
    # it. Give up soon and try again, for every apt-get after this.
    - name: Don't wait on a stalled package mirror
      if: runner.os == 'Linux'
      shell: bash
      run: |
        printf 'Acquire::http::Timeout "15";\nAcquire::Retries "5";\n' |
          sudo tee /etc/apt/apt.conf.d/90-soundor-ci > /dev/null

    # What a macOS job builds with, not whatever the runner image defaults to.
    # Moving past 16.4 needs the Metal toolchain too: xcodebuild
    # -downloadComponent MetalToolchain (it left Xcode in 26), for ANGLE.
    - name: Select Xcode
      if: runner.os == 'macOS'
      shell: bash
      run: |
        xcode=16.4
        developer="/Applications/Xcode_$xcode.app/Contents/Developer"
        [ -d "$developer" ] || { echo "::error::This runner has no Xcode $xcode"; exit 1; }
        echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
        echo "SOUNDOR_XCODE=$xcode" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        package-manager-cache: false

    - name: Install pnpm
      shell: bash
      run: |
        corepack enable
        corepack install

    - name: Get pnpm store path
      id: pnpm-cache
      if: ${{ inputs.cache == 'true' }}
      shell: bash
      run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Cache pnpm store
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-cache.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      env:
        HUSKY: '0'
      run: pnpm install --frozen-lockfile
