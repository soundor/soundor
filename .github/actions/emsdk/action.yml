name: Setup Emscripten
description: >
  Installs the pinned Emscripten SDK (cached per version and commit) and
  activates it for the job's later steps: what builds the engine's
  WebAssembly core (`pnpm --filter @soundor/engine build:wasm`).

inputs:
  cache:
    description: Restore and save the SDK in the Actions cache (release builds install it afresh)
    default: 'true'

runs:
  using: composite
  steps:
    # The engine's pin (engines/engine/wasm/emscripten.json, which the wasm
    # build checks and the module's input fingerprint covers), and emsdk's
    # tag of it by commit. Not EMSDK_*: emsdk_env.sh clears those.
    - name: Emscripten's version
      shell: bash
      run: |
        pin=engines/engine/wasm/emscripten.json
        {
          echo "SOUNDOR_EMSDK_VERSION=$(node -p "require('./$pin').version")"
          echo "SOUNDOR_EMSDK_COMMIT=$(node -p "require('./$pin').emsdkCommit")"
          echo "EMSDK=$RUNNER_TEMP/emsdk"
          echo "EMSDK_QUIET=1"
        } >> "$GITHUB_ENV"

    # The SDK emsdk installs for this exact version: what the cache holds is
    # what a fresh install would be.
    - name: Cache Emscripten
      id: emsdk-cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.EMSDK }}
        key: emsdk-${{ runner.os }}-${{ env.SOUNDOR_EMSDK_VERSION }}-${{ env.SOUNDOR_EMSDK_COMMIT }}

    - name: Install Emscripten
      if: steps.emsdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git init -q "$EMSDK"
        git -C "$EMSDK" fetch -q --depth 1 https://github.com/emscripten-core/emsdk.git "$SOUNDOR_EMSDK_COMMIT"
        git -C "$EMSDK" checkout -q FETCH_HEAD
        "$EMSDK/emsdk" install "$SOUNDOR_EMSDK_VERSION"
        "$EMSDK/emsdk" activate "$SOUNDOR_EMSDK_VERSION"

    # emcc for the later steps, of the pinned version.
    - name: Activate Emscripten
      shell: bash
      run: |
        source "$EMSDK/emsdk_env.sh"
        test "$(emcc -dumpversion)" = "$SOUNDOR_EMSDK_VERSION"
        echo "$EMSDK" >> "$GITHUB_PATH"
        echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
