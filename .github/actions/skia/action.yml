name: Skia
description: Installs what building Skia needs and keeps built Skias across runs

inputs:
  job:
    description: A name for the cache, unique per toolchain
    required: true

runs:
  using: composite
  steps:
    - name: Install build tools (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ninja-build libfontconfig1-dev libfreetype-dev

    - name: Install build tools (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: command -v ninja || brew install ninja

    - name: Install build tools (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: command -v ninja || choco install ninja -y --no-progress

    # Soundor builds Skia once per machine into SOUNDOR_CACHE (see
    # runtimes/juce-runtime/native/cmake/SoundorSkia.cmake).
    - name: Use the Skia cache
      shell: bash
      run: echo "SOUNDOR_CACHE=${{ runner.temp }}/soundor-cache" >> "$GITHUB_ENV"

    - name: Cache Skia
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/soundor-cache
        key: skia-${{ inputs.job }}-${{ hashFiles('runtimes/juce-runtime/native/cmake/SoundorSkia*.cmake', 'runtimes/juce-runtime/native/cmake/SoundorDependencies.cmake') }}
