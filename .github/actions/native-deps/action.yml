name: Native dependencies
description: Installs what building Skia, ANGLE and Hermes needs, a software GPU on Linux, and keeps their builds across runs

inputs:
  job:
    description: A name for the cache, unique per toolchain
    required: true

outputs:
  cache-key:
    description: The key to save the cache under at the end of the job
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-matched-key:
    description: The key of the restored cache, for ./.github/actions/native-deps-save
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    # Mesa's lavapipe is a Vulkan driver on the CPU: GPU tests run on it
    # (SOUNDOR_REQUIRE_GPU=1 makes them fail rather than skip without one).
    - name: Install build tools (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ccache lld-18 ninja-build libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers libvulkan1

    - name: Install build tools (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        command -v ninja || brew install ninja
        command -v ccache || brew install ccache

    - name: Install build tools (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: command -v ninja || choco install ninja -y --no-progress

    # Visual Studio builds one project at a time unless told otherwise; every
    # cmake --build reads this (sources within a project: /MP, which the
    # engine's CMake and JUCE's flags set).
    - name: Build projects in parallel (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$NUMBER_OF_PROCESSORS" >> "$GITHUB_ENV"

    # Soundor builds Skia, ANGLE and Hermes once per machine into SOUNDOR_CACHE
    # (see runtimes/engine/cmake/SoundorSkia.cmake,
    # SoundorAngle.cmake, SoundorHermes.cmake).
    - name: Use the native dependency cache
      shell: bash
      run: echo "SOUNDOR_CACHE=${{ runner.temp }}/soundor-cache" >> "$GITHUB_ENV"

    # Compiler cache where CMake can launch the compiler through it: Ninja and
    # Makefiles (Linux, macOS), not Visual Studio. Saved only on main
    # (./.github/actions/native-deps-save): pull requests start from main's,
    # and one entry per pull request commit would fill the repository's cache.
    - name: Enable compiler cache
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=${{ runner.temp }}/ccache" >> "$GITHUB_ENV"
        echo "CCACHE_BASEDIR=${{ github.workspace }}" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
        echo "SOUNDOR_CCACHE_KEY=ccache-${{ inputs.job }}-${{ github.job }}-${{ github.sha }}" >> "$GITHUB_ENV"

    - name: Restore compiler cache
      if: runner.os != 'Windows'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-${{ inputs.job }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ inputs.job }}-${{ github.job }}-

    # Each build lives in a directory keyed by what made it, so an older cache
    # is a fine start: only what changed is built again. The job saves it at
    # its end, also when tests failed, under this key and the builds it holds
    # complete (./.github/actions/native-deps-save), so a long build is never
    # done twice. The newest entry for the same recipes is restored first.
    - name: Restore Skia, ANGLE and Hermes
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/soundor-cache
        key: native-deps-${{ inputs.job }}-${{ hashFiles('runtimes/engine/cmake/SoundorSkia*.cmake', 'runtimes/engine/cmake/SoundorAngle*.cmake', 'runtimes/engine/cmake/angle/**', 'runtimes/engine/cmake/SoundorHermes*.cmake', 'runtimes/engine/cmake/hermes/**', 'runtimes/engine/cmake/SoundorDependencies.cmake') }}
        restore-keys: |
          native-deps-${{ inputs.job }}-${{ hashFiles('runtimes/engine/cmake/SoundorSkia*.cmake', 'runtimes/engine/cmake/SoundorAngle*.cmake', 'runtimes/engine/cmake/angle/**', 'runtimes/engine/cmake/SoundorHermes*.cmake', 'runtimes/engine/cmake/hermes/**', 'runtimes/engine/cmake/SoundorDependencies.cmake') }}-
          native-deps-${{ inputs.job }}-
