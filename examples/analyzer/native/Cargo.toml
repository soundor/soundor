# The analyzer's audio processing, in Rust: it passes its audio through and
# publishes the spectrum and peak of what it hears to the UI, through
# soundor.config.ts's native channels.
[package]
name = "soundor-analyzer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Soundor's SDK, with the channels of soundor.config.ts, written by
# `soundor gen` (which `soundor dev` and `soundor build` run).
soundor = { path = "../.soundor/generated/rust/soundor" }

# soundor dev's builds, and tests: optimized enough to process audio in real
# time, still with debug assertions and symbols.
[profile.dev]
opt-level = 1

[workspace]
